name: Find GTFS feeds

# One-off helper: lists GTFSデータリポジトリ feeds matching a keyword and probes
# a few known URLs, so the right download link can be wired into the data build.
on:
  push:
    paths:
      - .github/workflows/find-feeds.yml

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Search catalogue
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request("https://api.gtfs-data.jp/v2/feeds", headers={"User-Agent": "ONIZUKAAppStore"})
          body = json.loads(urllib.request.urlopen(req, timeout=60).read())["body"]
          print("feeds in catalogue:", len(body))
          for f in body:
              text = json.dumps(f, ensure_ascii=False)
              if any(k in text for k in ("名鉄", "meitetsu", "名古屋鉄道")):
                  print(json.dumps({k: f.get(k) for k in ("organization_id", "organization_name", "feed_id", "feed_name", "feed_memo", "feed_license", "feed_src_gtfs_current_url", "feed_src_gtfs_web_url")}, ensure_ascii=False))
          PY
      - name: Probe URLs
        run: |
          for u in \
            "https://www.meitetsu-bus.co.jp/" \
            "https://www.meitetsu-bus.co.jp/opendata/" \
            "https://www.meitetsu-bus.co.jp/gtfs/" \
            "https://ckan.odpt.org/dataset/?q=%E5%90%8D%E9%89%84" ; do
            code=$(curl -s -o /tmp/p.html -w "%{http_code}" -L --max-time 30 "$u"); echo "$code $u"
            grep -oiE 'href="[^"]*(gtfs|zip|opendata|オープンデータ)[^"]*"' /tmp/p.html | head -20 || true
          done
