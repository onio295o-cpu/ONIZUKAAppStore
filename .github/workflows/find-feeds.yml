name: Find GTFS feeds

# One-off helper: reads 名鉄バス's terms of use and the timetable system's robots.txt,
# and retries the ODPT catalogue, to see whether 名鉄バス timetables may be used.
on:
  push:
    paths:
      - .github/workflows/find-feeds.yml

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Terms of use (/agreement)
        run: |
          UA="Mozilla/5.0 (compatible; ONIZUKAAppStore research)"
          curl -sL --max-time 30 -A "$UA" https://www.meitetsu-bus.co.jp/agreement -o a.html
          python3 - <<'PY'
          import re, html
          s = open("a.html", encoding="utf-8", errors="replace").read()
          main = re.search(r"<main.*?</main>", s, re.S)
          s = main.group(0) if main else s
          t = html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S))
          t = re.sub(r"<(br|/p|/li|/h\d|/dt|/dd|/div)[^>]*>", "\n", t)
          t = re.sub(r"<[^>]+>", " ", t)
          lines = [" ".join(l.split()) for l in t.split("\n")]
          print("\n".join(l for l in lines if l)[:6000])
          PY
      - name: Timetable system robots.txt and terms links
        run: |
          UA="Mozilla/5.0 (compatible; ONIZUKAAppStore research)"
          echo "== trainbus robots.txt"; curl -sL --max-time 30 -A "$UA" https://trainbus.meitetsu.co.jp/robots.txt | head -30
          curl -sL --max-time 30 -A "$UA" https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc/map/Top -o t.html
          echo "== transfer top ($(wc -c < t.html) bytes)"
          grep -oiE 'href="[^"]*(rule|kiyaku|agreement|policy|terms|riyou)[^"]*"' t.html | sort -u | head
      - name: ODPT catalogue
        run: |
          for u in "https://ckan.odpt.org/api/3/action/package_search?q=%E5%90%8D%E9%89%84%E3%83%90%E3%82%B9&rows=50" "https://ckan.odpt.org/api/action/package_search?q=meitetsu&rows=50"; do
            echo "== $u"; curl -sL --max-time 60 "$u" | head -c 1500; echo
          done
