name: Find GTFS feeds

# One-off helper: looks for an openly licensed 名鉄バス timetable feed and reads
# the site's terms, so we know what may be used.
on:
  push:
    paths:
      - .github/workflows/find-feeds.yml

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: ODPT catalogue
        run: |
          for q in 名鉄バス meitetsu 名古屋鉄道; do
            curl -s --max-time 60 -G "https://ckan.odpt.org/api/3/action/package_search" --data-urlencode "q=$q" --data-urlencode "rows=50" -o odpt.json || true
            python3 - "$q" <<'PY'
          import json, sys
          try:
              r = json.load(open("odpt.json"))["result"]
          except Exception as e:
              print(sys.argv[1], "error", e); sys.exit()
          print(f"[{sys.argv[1]}] {r['count']} datasets")
          for d in r["results"]:
              org = (d.get("organization") or {}).get("title", "")
              print(" -", d["name"], "|", d.get("title"), "|", org, "|", d.get("license_title"))
              for res in d.get("resources", [])[:6]:
                  print("     ", res.get("format"), res.get("name"), res.get("url"))
          PY
          done
      - name: 名鉄バス site
        run: |
          UA="Mozilla/5.0 (compatible; ONIZUKAAppStore research)"
          curl -sL --max-time 30 -A "$UA" https://www.meitetsu-bus.co.jp/robots.txt -o robots.txt; echo "== robots.txt"; cat robots.txt | head -40
          for u in https://www.meitetsu-bus.co.jp/rosen https://www.meitetsu-bus.co.jp/ ; do
            curl -sL --max-time 30 -A "$UA" "$u" -o page.html
            echo "== $u ($(wc -c < page.html) bytes)"
            python3 - <<'PY'
          import re, html
          s = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.search(r"<title>(.*?)</title>", s, re.S)
          print("title:", t.group(1).strip() if t else "")
          seen = set()
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', s, re.S):
              href = html.unescape(m.group(1)); text = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", m.group(2))).split())[:50]
              key = href
              if key in seen: continue
              seen.add(key)
              if re.search(r"gtfs|opendata|オープンデータ|zip|csv|時刻|jikoku|timetable|search|policy|ポリシー|規約|terms|著作|サイト", href + text, re.I):
                  print(f"  {text} -> {href}")
          for m in re.finditer(r'(?:src|action)="([^"]+)"', s):
              if re.search(r"jikoku|timetable|search|navi|api", m.group(1), re.I):
                  print("  [src/action]", m.group(1))
          PY
          done
      - name: Site policy text
        run: |
          UA="Mozilla/5.0 (compatible; ONIZUKAAppStore research)"
          for u in https://www.meitetsu-bus.co.jp/sitepolicy https://www.meitetsu-bus.co.jp/policy https://www.meitetsu-bus.co.jp/site https://www.meitetsu-bus.co.jp/terms https://www.meitetsu-bus.co.jp/privacy; do
            code=$(curl -sL --max-time 30 -A "$UA" -o p.html -w "%{http_code}" "$u"); echo "== $code $u"
            [ "$code" = 200 ] && python3 - <<'PY'
          import re, html
          s = open("p.html", encoding="utf-8", errors="replace").read()
          t = " ".join(html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", s, flags=re.S)).split())
          for k in ("著作", "転載", "複製", "無断", "リンク", "禁止", "二次利用", "データ"):
              for m in re.finditer(k, t):
                  print(f"  [{k}]", t[max(0, m.start()-120):m.end()+160])
                  break
          PY
          done
