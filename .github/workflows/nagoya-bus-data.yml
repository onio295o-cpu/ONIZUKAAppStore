name: Update Nagoya city bus data

on:
  workflow_dispatch:
    inputs:
      gtfs_url:
        description: "GTFS zip URL (leave empty to use the newest zip in gtfs/)"
        required: false
  push:
    paths:
      - gtfs/**
      - scripts/build_nagoya_bus.py
      - .github/workflows/nagoya-bus-data.yml

permissions:
  contents: write

concurrency:
  group: nagoya-bus-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-fermi-efwz91

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Uses the newest zip in gtfs/ (upload a new one there after a 市バス ダイヤ改正);
      # with a gtfs_url input it downloads that instead.
      - name: Build data
        env:
          GTFS_URL: ${{ github.event.inputs.gtfs_url }}
        run: |
          zip=$(ls -1 gtfs/*.zip 2>/dev/null | sort | tail -n 1)
          if [ -n "$GTFS_URL" ] || [ -z "$zip" ]; then
            python3 -u scripts/build_nagoya_bus.py --download bus/data
          else
            echo "building from $zip"
            python3 -u scripts/build_nagoya_bus.py "$zip" bus/data
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus/data
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "Update Nagoya city bus data"
            git push origin HEAD:claude/zealous-fermi-efwz91
          fi
