name: Update bus data

# Downloads every feed in gtfs/feeds.json (名古屋市営バス + nearby operators and
# community buses), merges them into bus/data, routes new stop-to-stop legs
# along roads, and commits the result. Runs monthly so ダイヤ改正 are picked up.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 1 * *" # 03:00 JST on the 2nd of every month
  push:
    paths:
      - gtfs/feeds.json
      - scripts/fetch_feeds.py
      - scripts/build_nagoya_bus.py
      - scripts/build_shapes.py
      - .github/workflows/nagoya-bus-data.yml

permissions:
  contents: write

concurrency:
  group: nagoya-bus-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-fermi-efwz91

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # a feed that fails to download keeps its previous zip in gtfs/feeds/
      - name: Download feeds
        run: python3 -u scripts/fetch_feeds.py gtfs/feeds.json

      - name: Build data
        run: python3 -u scripts/build_nagoya_bus.py --feeds gtfs/feeds.json bus/data

      # Road-following lines between stops (the feeds have no shapes.txt).
      # bus/data/legs.json caches earlier results, so only new legs are routed.
      - name: Route stop-to-stop legs along roads
        run: python3 -u scripts/build_shapes.py bus/data

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtfs/feeds bus/data
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "Update bus data"
            # the branch may have moved while this ran (routing takes a while)
            git pull --rebase origin claude/zealous-fermi-efwz91
            git push origin HEAD:claude/zealous-fermi-efwz91
          fi
