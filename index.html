<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さんすうクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* ===== デザイン方針：えほん風（クリーム色の紙・こげ茶の太い線・はっきりした色・大きな文字） ===== */
:root{
  --paper:#fff8e7; --paper2:#ffefc8; --ink:#3b2a1e; --ink2:#6b5444;
  --orange:#ff8a3d; --orange2:#d9601a; --yellow:#ffd23f; --yellow2:#d9a400;
  --green:#3ec46d; --green2:#25934d; --blue:#43a6ff; --blue2:#1f73c4; --red:#ff5a6e; --red2:#c4304a;
  --line:4px solid var(--ink); --r:22px; --pop:0 6px 0 var(--ink);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-weight:800;color:var(--ink);background:var(--paper);overflow:hidden;font-size:20px;line-height:1.35}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.hide{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.wrap{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px 18px;position:relative}

/* 背景（やわらかい空と地面） */
.bg-night{background:linear-gradient(#bfe6ff 0,#e4f5ff 60%,#fff3d6 100%)}
.stars::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:radial-gradient(60px 26px at 15% 14%,#fff 98%,transparent),radial-gradient(44px 20px at 22% 11%,#fff 98%,transparent),
  radial-gradient(70px 28px at 82% 22%,#fff 98%,transparent),radial-gradient(46px 22px at 74% 19%,#fff 98%,transparent)}
.bg-meadow{background:linear-gradient(#a8dcff 0,#dff3ff 55%,#8fd77a 55%,#63bd5a 100%)}
.bg-forest{background:linear-gradient(#b5e8c8 0,#e6f8ea 55%,#6cc06a 55%,#3f9a4c 100%)}
.bg-desert{background:linear-gradient(#ffd3a1 0,#fff0d4 55%,#f5cf86 55%,#e0ac5a 100%)}
.bg-sky{background:linear-gradient(#b3c2ff 0,#e9e4ff 55%,#ffffff 55%,#e6e1ff 100%)}
.bg-cave{background:linear-gradient(#c9b7f0 0,#ede5ff 55%,#9b86c9 55%,#7a66a8 100%)}
.bg-volcano{background:linear-gradient(#ffb3a1 0,#ffe6dc 55%,#c98a6a 55%,#a5674c 100%)}
.bg-ice{background:linear-gradient(#b9dcff 0,#eef7ff 55%,#d7ecff 55%,#aed2f5 100%)}
.bg-castle{background:linear-gradient(#c9c3ee 0,#f0edff 55%,#b8b3c9 55%,#958fa8 100%)}

/* パネル・ボタン（太いこげ茶の線＋ずらした影） */
.panel{background:var(--paper);border:var(--line);border-radius:var(--r);box-shadow:var(--pop)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border-radius:22px;padding:14px 20px;font-size:1.5rem;
  color:var(--ink);background:var(--yellow);border:var(--line);box-shadow:0 7px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:#fff}
.btn.ghost{min-height:52px;background:#fff;padding:6px 14px;font-size:1.05rem;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:16px}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#d8d2c8;color:#9a8f84}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.8rem;background:var(--ink);color:#fff}
.title-logo{font-size:clamp(3rem,14vw,4.4rem);line-height:1.02;text-align:center;margin:0;color:var(--orange);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);letter-spacing:.02em}
.title-logo span{color:var(--yellow)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.hdr h2{margin:0;font-size:clamp(1.05rem,5vw,1.4rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
.hdr .sp{width:86px}
.starline{color:var(--ink);font-size:1.05rem}

/* ===== ホーム ===== */
#home .wrap{justify-content:space-between}
.home-stage{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:200px;padding-bottom:16px;position:relative}
.home-stage::after{content:"";position:absolute;left:8%;right:8%;bottom:6px;height:26px;border-radius:50%;background:rgba(59,42,30,.14)}
.home-stage .hero{width:140px;animation:bob 1.6s ease-in-out infinite;z-index:1}
.home-stage .hero img{width:100%;max-height:220px;object-fit:contain}
.home-stage .enemy{width:120px;animation:bob 1.3s ease-in-out infinite reverse;z-index:1}
@keyframes bob{50%{transform:translateY(-10px)}}
.menu{display:flex;flex-direction:column;gap:18px}
.menu .sub{font-size:1.25rem;white-space:nowrap;padding:12px 8px}
.chip:empty{visibility:hidden}
.menu .main{min-height:92px;font-size:2rem;background:var(--orange);color:#fff;-webkit-text-stroke:0}

/* ===== コース・ステージ ===== */
.list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 4px 16px;align-content:start}
.course{padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .06s}
.course:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.course .ic{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.3rem;border:var(--line)}
.course .nm{font-size:1rem;line-height:1.25;word-break:keep-all}
.path{flex:1;display:flex;flex-direction:column-reverse;justify-content:space-around;align-items:center;padding:16px 0}
.node{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;
  background:var(--yellow);border:var(--line);box-shadow:0 7px 0 var(--ink)}
.node small{font-size:.8rem;letter-spacing:1px;color:var(--ink)}
.node.boss{width:116px;height:116px;background:var(--red);color:#fff}
.node.boss small{color:#fff}
.node.lock{background:#d8d2c8;color:#8a7f74}
.node:nth-child(odd){transform:translateX(-58px)}.node:nth-child(even){transform:translateX(58px)}
.node.now{animation:nodepulse 1s ease-in-out infinite}
@keyframes nodepulse{50%{box-shadow:0 7px 0 var(--ink),0 0 0 10px rgba(255,138,61,.45)}}

/* ===== バトル ===== */
#battle .wrap{gap:14px}
.arena{position:relative;height:36vh;min-height:220px;flex-shrink:0;overflow:visible}
.enemy-box{position:absolute;right:5%;top:6%;width:46%;max-width:200px;text-align:center;z-index:1}
.enemy-box .enemy img{display:block;width:100%;max-height:26vh;object-fit:contain}
.enemy-box .enemy{width:100%;margin-top:4px;animation:bob 1.4s ease-in-out infinite;transform-origin:50% 100%}
.enemy-box .enemy.hit{animation:hit .45s}
.enemy-box .enemy.attack{animation:eatk .5s}
.enemy-box .enemy.down{animation:down .9s forwards}
@keyframes hit{0%,100%{filter:none;transform:none}20%{filter:brightness(1.8);transform:translateX(14px) scale(1.06,.94)}50%{transform:translateX(-8px)}}
@keyframes eatk{40%{transform:translateX(-40%) scale(1.12)}}
@keyframes down{30%{filter:brightness(1.8);transform:scale(1.2,.8)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.ename{font-size:.85rem;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 10px;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.hpbar{height:18px;border-radius:99px;background:#fff;border:3px solid var(--ink);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--green);transition:width .4s}
.hpbar.low i{background:var(--red)}
.hero-box{position:absolute;left:5%;bottom:5%;width:36%;max-width:150px;z-index:2}
.hero-box img,.hero-box svg{display:block;width:100%;max-height:24vh;object-fit:contain;animation:bob 1.8s ease-in-out infinite}
.hero-box.atk{animation:dash .55s cubic-bezier(.3,.6,.4,1)}
@keyframes dash{0%{transform:none}35%{transform:translateX(110%) translateY(-20%) scale(1.1)}100%{transform:none}}
.hero-box.hurt{animation:hurt .45s}
@keyframes hurt{30%{transform:translateX(-14px) rotate(-6deg)}}
.slash{position:absolute;right:12%;top:22%;width:40%;pointer-events:none;opacity:0;z-index:3}
.slash.on{animation:slash .4s ease-out}
@keyframes slash{0%{opacity:1;transform:scale(.4) rotate(-30deg)}60%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(10deg)}}
.dmg{position:absolute;right:14%;top:18%;font-size:2.4rem;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0;z-index:4;white-space:nowrap}
.dmg.on{animation:dmg .8s ease-out}
@keyframes dmg{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.3)}100%{opacity:0;transform:translateY(-40px)}}
.combo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:1.6rem;color:var(--orange);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;opacity:0;white-space:nowrap;z-index:4}
.combo.on{animation:cpop .8s ease-out forwards}
@keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.4)}40%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.qwin{padding:20px 14px 12px;text-align:center;position:relative}
.qcount{position:absolute;top:-17px;left:16px;font-size:.9rem;background:var(--orange);color:#fff;padding:2px 12px;border-radius:99px;border:3px solid var(--ink)}
.eq{font-size:clamp(2.8rem,14vw,4rem);letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.eq .q{color:var(--orange)}
.pics{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.7rem}
.pics .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:44%}
.hint{min-height:1.5em;font-size:1.1rem;color:var(--blue2);margin-top:6px}
.hint .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px;font-size:1.1rem;letter-spacing:3px;color:var(--ink)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto}
.answers .btn{font-size:clamp(2.4rem,12vw,3.4rem);min-height:104px;padding:0;background:#fff}
.answers .btn:nth-child(1){background:#fff1b8}.answers .btn:nth-child(2){background:#d8f0ff}.answers .btn:nth-child(3){background:#ffe0e6}
.answers .btn.ng{animation:shake .35s}
.answers .btn.ng:disabled{background:#d8d2c8}
.answers .btn.ok{background:var(--green);color:#fff}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hs{display:grid;grid-template-columns:repeat(4,54px);justify-content:center;gap:2px 6px;font-size:2.6rem;font-variant-numeric:tabular-nums}
.hs div{height:54px;display:flex;align-items:center;justify-content:center}
.hs .cy{height:24px;font-size:1.3rem;color:var(--red)}
.hs .ln{height:5px;background:var(--ink);border-radius:3px;grid-column:1/-1}
.hs .bx{border:3px dashed var(--ink2);border-radius:12px;color:var(--green2);background:#fff}
.hs .bx.on{border:4px solid var(--orange);background:#fff1b8}
.hs .bx.off{border:none;background:none}
.hs .bx.ng{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:auto}
.pad .btn{font-size:2.2rem;min-height:76px;padding:0;background:#fff}

/* ===== 世界（背景レイヤー：空・太陽・雲・遠い山・地面・かざり） ===== */
#battle{background:linear-gradient(var(--sky1),var(--sky2))}
.scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.scene .sun{position:absolute;top:8%;right:9%;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffbe0,var(--sunc) 65%);
  box-shadow:0 0 50px 20px var(--glow);animation:sunb 5s ease-in-out infinite}
@keyframes sunb{50%{transform:scale(1.07)}}
.scene .cloud{position:absolute;width:130px;height:40px;border-radius:40px;background:var(--cloud);animation:drift linear infinite}
.scene .cloud::before,.scene .cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.scene .cloud::before{width:58px;height:58px;top:-28px;left:22px}.scene .cloud::after{width:42px;height:42px;top:-18px;left:68px}
.scene .c1{top:12%;animation-duration:38s;animation-delay:-8s}.scene .c2{top:24%;transform:scale(.7);animation-duration:52s;animation-delay:-30s;opacity:.85}
.scene .c3{top:6%;animation-duration:64s;animation-delay:-45s;opacity:.7}
@keyframes drift{from{translate:-180px 0}to{translate:110vw 0}}
.scene .hill{position:absolute;border-radius:50% 50% 0 0;border-top:4px solid rgba(59,42,30,.25)}
.scene .h1{left:-30%;width:95%;height:30%;top:24%;background:var(--hill1);animation:breathe 9s ease-in-out infinite}
.scene .h2{right:-30%;width:100%;height:32%;top:27%;background:var(--hill2);animation:breathe 11s ease-in-out infinite reverse}
@keyframes breathe{50%{transform:translateY(4px)}}
.scene .ground{position:absolute;left:-10%;right:-10%;top:38%;bottom:0;background:var(--ground);border-radius:40% 40% 0 0/40px 40px 0 0;border-top:5px solid rgba(59,42,30,.3)}
.scene .deco span{position:absolute;top:var(--y);left:var(--x);font-size:var(--s);transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.scene.float .deco span{animation:floaty 4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes floaty{to{transform:translateY(-14px)}}
.scene.pulse .sun{animation:sunp .7s ease-out}
@keyframes sunp{40%{transform:scale(1.35);box-shadow:0 0 90px 40px var(--glow)}}
.scene.pulse .deco span{animation:hop .6s ease-out}
@keyframes hop{40%{transform:translateY(-18px) scale(1.15)}}
.scene.pulse .h1,.scene.pulse .h2{animation:jig .5s}
@keyframes jig{30%{transform:scaleY(1.06)}60%{transform:scaleY(.97)}}
.scene.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}
#battle .wrap{z-index:1}
.ground-shadow{position:absolute;bottom:-2px;width:70%;left:15%;height:16px;border-radius:50%;background:rgba(59,42,30,.22)}
.hdr .coins{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:1rem;min-width:86px;text-align:center;box-shadow:0 3px 0 var(--ink)}
.hdr .coins.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ===== ごほうび演出レイヤー（操作のじゃまをしない） ===== */
#fxl{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.fx{position:absolute}
.fx img,.fx svg{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.fx-actor{width:min(46vw,230px);height:min(36vh,280px);left:50%;top:22%;margin-left:min(-23vw,-115px)}
.fx-word{left:0;right:0;top:12%;text-align:center;font-size:clamp(1.9rem,10vw,3.6rem);color:var(--yellow);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--ink);animation:wordpop 1.3s cubic-bezier(.3,1.6,.5,1) forwards;white-space:nowrap}
@keyframes wordpop{0%{transform:scale(0) rotate(-12deg)}25%{transform:scale(1.15) rotate(4deg)}40%{transform:scale(1) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.say{position:absolute;left:50%;top:-12%;transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:18px;padding:4px 12px;font-size:1.1rem;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.say::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
/* パターン */
.p-tobi{animation:p-tobi 1.7s cubic-bezier(.25,.8,.35,1) forwards}
@keyframes p-tobi{0%{transform:translate(-110vw,-30vh) rotate(-50deg) scale(.7)}40%{transform:translate(0,0) rotate(12deg) scale(1.15,.85)}52%{transform:scale(.9,1.12)}64%{transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-20px)}}
.p-yaburi .hole{position:absolute;left:50%;top:30%;width:min(80vw,380px);height:min(80vw,380px);margin:min(-40vw,-190px) 0 0 min(-40vw,-190px);animation:hole 1.8s ease-out forwards}
@keyframes hole{0%{transform:scale(0) rotate(-20deg)}18%{transform:scale(1.1) rotate(3deg)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.p-yaburi .fx-actor{animation:p-yab 1.8s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes p-yab{0%,12%{transform:scale(.1);opacity:0}30%{transform:scale(1.35);opacity:1}45%{transform:scale(1.05) rotate(-4deg)}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.p-kyodai{animation:p-kyo 1.9s cubic-bezier(.3,1.4,.5,1) forwards;transform-origin:50% 100%}
@keyframes p-kyo{0%{transform:scale(.3) translateY(60%);opacity:0}20%{opacity:1;transform:scale(1)}50%{transform:scale(2.6)}62%{transform:scale(2.45) rotate(3deg)}80%{transform:scale(2.5) rotate(-2deg);opacity:1}100%{transform:scale(3.2);opacity:0}}
.p-run{top:40%;animation:p-run 1.9s linear forwards}
@keyframes p-run{0%{transform:translateX(70vw)}100%{transform:translateX(-90vw)}}
.p-run img,.p-run svg{animation:runhop .28s ease-in-out infinite alternate}
@keyframes runhop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
.manga{inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,#fff 0 4deg,#e9e3d6 4deg 8deg);animation:manga 1.4s steps(1) forwards}
@keyframes manga{0%{opacity:1}92%{opacity:1}100%{opacity:0}}
.p-manga{animation:p-manga 1.4s forwards;filter:grayscale(1) contrast(1.6)}
@keyframes p-manga{0%{transform:scale(2.4) rotate(-8deg)}10%{transform:scale(1.7) rotate(6deg)}20%,92%{transform:scale(1.8) rotate(-3deg)}100%{opacity:0}}
.manga-word{color:#111!important;-webkit-text-stroke:0!important;text-shadow:4px 4px 0 #fff,-4px -4px 0 #fff!important;font-size:clamp(2.6rem,14vw,4.6rem)!important;letter-spacing:.06em}
.p-hyokko{top:auto;bottom:-4vh;animation:p-hyo 1.8s ease-in-out forwards}
@keyframes p-hyo{0%{transform:translateY(100%)}25%{transform:translateY(8%) rotate(-8deg)}40%{transform:translateY(12%) rotate(10deg)}55%{transform:translateY(8%) rotate(-6deg)}75%{transform:translateY(10%)}100%{transform:translateY(110%)}}
.p-kuru{top:34%;animation:p-kuru 1.8s cubic-bezier(.4,0,.6,1) forwards}
@keyframes p-kuru{0%{transform:translateX(-80vw) translateY(10vh) rotate(0)}50%{transform:translateX(0) translateY(-6vh) rotate(540deg)}100%{transform:translateX(90vw) translateY(10vh) rotate(1080deg)}}
.p-pyon{top:44%;animation:p-pyonx 1.9s linear forwards}
.p-pyon img,.p-pyon svg{animation:pyony .475s cubic-bezier(.3,0,.7,1) 4}
@keyframes p-pyonx{0%{transform:translateX(-70vw)}100%{transform:translateX(80vw)}}
@keyframes pyony{0%,100%{transform:translateY(0) scale(1.15,.85)}50%{transform:translateY(-26vh) scale(.92,1.1)}}
.p-buni{animation:p-buni 1.7s ease-in-out forwards}
@keyframes p-buni{0%{transform:scale(0)}12%{transform:scale(1)}22%{transform:scale(1.7,.5)}34%{transform:scale(.6,1.6)}46%{transform:scale(1.5,.65) skewX(14deg)}58%{transform:scale(.8,1.3) skewX(-14deg)}72%{transform:scale(1.1,.9)}86%{transform:none;opacity:1}100%{opacity:0}}
.hanage{left:var(--x);top:0;width:44px;height:var(--h);margin-left:-22px;transform-origin:50% 0;animation:hana 1.6s ease-in-out forwards}
.hanage svg{filter:none}
@keyframes hana{0%{transform:scaleY(0)}25%{transform:scaleY(1)}55%{transform:scaleY(.55)}75%{transform:scaleY(1.02)}90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
.enemy.yank{animation:yank 1.6s ease-in-out!important}
@keyframes yank{25%{transform:none}55%{transform:translateY(-45%) rotate(14deg) scale(.9,1.15)}75%{transform:translateY(6%) scale(1.15,.85)}88%{transform:none}}
.ufo{left:50%;top:6%;width:120px;margin-left:-60px;font-size:5rem;text-align:center;animation:ufo 2s ease-in-out forwards}
@keyframes ufo{0%{transform:translateX(-80vw)}20%,80%{transform:none}100%{transform:translateX(80vw)}}
.beam{left:50%;top:15%;width:200px;margin-left:-100px;height:46vh;background:linear-gradient(rgba(180,255,170,.75),rgba(180,255,170,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:beam 2s forwards}
@keyframes beam{0%,22%{opacity:0}30%,70%{opacity:1}78%,100%{opacity:0}}
.p-ufo{animation:p-ufo 2s ease-in-out forwards}
@keyframes p-ufo{0%,25%{transform:translateY(20vh) scale(1)}55%{transform:translateY(-12vh) scale(.35) rotate(360deg)}70%{transform:translateY(-12vh) scale(.35)}82%{transform:translateY(20vh) scale(1.1,.85)}92%{transform:translateY(20vh);opacity:1}100%{opacity:0}}
.p-parade{top:auto;bottom:6vh;width:min(28vw,150px);height:min(26vh,200px);margin-left:0;animation:parade 2.1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes parade{0%{transform:translateY(120%)}25%{transform:translateY(0)}35%{transform:translateY(-14%)}45%{transform:translateY(0)}55%{transform:translateY(-14%)}65%{transform:translateY(0)}88%{opacity:1}100%{transform:translateY(120%);opacity:0}}
/* エフェクト */
.cf{top:-4vh;width:10px;height:16px;border-radius:2px;left:var(--x);background:var(--c);animation:cf var(--t) cubic-bezier(.3,.6,.6,1) forwards;animation-delay:var(--d)}
@keyframes cf{0%{transform:translateY(0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.shock{left:50%;top:var(--y);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:8px solid #fff;animation:shock .6s ease-out forwards}
@keyframes shock{0%{transform:scale(.2);opacity:1}100%{transform:scale(14);opacity:0;border-width:1px}}
.sparks span{position:absolute;font-size:1.8rem;animation:spark .8s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}
.coinfly{font-size:1.6rem;color:var(--yellow);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;left:50%;top:44%;animation:coinfly 1s ease-in forwards;white-space:nowrap}
@keyframes coinfly{0%{transform:translate(-50%,0) scale(.6);opacity:0}25%{transform:translate(-50%,-20px) scale(1.2);opacity:1}100%{transform:translate(32vw,-40vh) scale(.6);opacity:0}}
.stamp{position:absolute;right:-12px;top:-40px;width:84px;height:84px;font-size:1rem!important;border-radius:50%;border:6px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;line-height:1.1;background:rgba(255,255,255,.9);transform:rotate(-14deg);animation:stamp .5s .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.fx{animation-duration:.01s!important}}
/* ===== 動画 ===== */
.clipov{position:fixed;inset:0;z-index:40;background:rgba(20,14,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.clipov iframe{width:min(100%,720px);aspect-ratio:16/9;border:var(--line);border-radius:16px;background:#000}
/* ===== リザルト ===== */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(59,42,30,.55)}
.result{width:min(92vw,430px);padding:24px 18px 20px;text-align:center;position:relative;z-index:2}
.result h2{margin:0 0 4px;font-size:2.2rem;color:var(--orange);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.bigstars{font-size:3.4rem;letter-spacing:6px;margin:4px 0}
.bigstars span{display:inline-block;opacity:.25;filter:grayscale(1)}
.bigstars span.on{opacity:1;filter:none;animation:starin .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.party{display:flex;justify-content:center;gap:6px;height:120px;margin:6px 0}
.party img,.party svg{height:100%;max-width:33%;object-fit:contain;animation:dance .6s ease-in-out infinite alternate}
.party img:nth-child(2){animation-delay:-.2s}.party img:nth-child(3){animation-delay:-.4s}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-12px)}}
.result .row{display:flex;gap:12px;margin-top:16px}.result .row .btn{flex:1}
#fw{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;display:none}

/* ===== なかま・せってい ===== */
.chars{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 4px;align-content:start}
.chars .c{padding:8px 6px;text-align:center;font-size:.8rem;line-height:1.2}
.chars img{width:100%;height:92px;object-fit:contain}
.setting{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:1.3rem;margin-top:16px}
.toggle{width:76px;height:44px;border-radius:99px;background:#d8d2c8;border:var(--line);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:left .2s}
.toggle.on{background:var(--green)}.toggle.on::after{left:35px}
.note{font-size:.95rem;font-weight:500;color:var(--ink2);line-height:1.5;text-align:center}
a.btn{text-decoration:none}
</style>
</head>

<script>
/* ================================================================
   1) ロジック（画面から独立）：問題生成・選択肢・ヒント・星
   ================================================================ */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const SYM = {add:'＋', mul:'×', div:'÷'}, WORD = {add:'たす', mul:'かける', div:'わる'};

const Logic = {
  gen(type){
    if(type === 'mix') type = pick(['add200', 'mul', 'div']);
    let a, b;
    switch(type){
      case 'add4':   do{ a = rnd(1, 5); b = rnd(1, 5); }while(a + b > 5);  return {op:'add', a, b, ans:a + b, max:5, pics:true};
      case 'add5':   do{ a = rnd(1, 9); b = rnd(1, 9); }while(a + b > 10); return {op:'add', a, b, ans:a + b, max:10, pics:true};
      case 'add200': do{ a = rnd(11, 150); b = rnd(11, 100); }while(a + b > 200);
                     return {op:'add', a, b, ans:a + b, max:200, near:[-10, 10, -1, 1, -2, 2]};
      case 'mul':    a = rnd(1, 9); b = rnd(1, 9);
                     return {op:'mul', a, b, ans:a * b, max:81, nearAbs:[a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b]};
      case 'div':  { b = rnd(2, 9); const q = rnd(1, 9); return {op:'div', a:b * q, b, ans:q, max:9}; }
      case 'h22':    a = rnd(10, 99); b = rnd(10, 99); return {op:'add', a, b, ans:a + b, hissan:true};
      case 'h32':    a = rnd(100, 899); b = rnd(10, 99); return {op:'add', a, b, ans:a + b, hissan:true};
    }
  },
  choices(p){
    const set = new Set([p.ans]), ok = w => Number.isInteger(w) && w >= 0 && w <= p.max && w !== p.ans;
    const cand = [...(p.nearAbs || []), ...(p.near || []).map(d => p.ans + d)].filter(ok);
    for(let g = 0; set.size < 3 && g < 200; g++){
      const w = cand.length && Math.random() < .75 ? pick(cand) : p.ans + rnd(-3, 3);
      if(ok(w)) set.add(w);
    }
    for(let w = 0; set.size < 3; w++) if(ok(w)) set.add(w);
    return shuffle([...set]);
  },
  hint(p){
    if(p.op === 'add' && p.pics) return {text:'ひとつずつ かぞえて みよう！', dots:[p.a, p.b]};
    if(p.op === 'add'){ const t = p.b - p.b % 10, o = p.b % 10;
      return {text:o && t ? `${p.a} ＋ ${t} ＝ ${p.a + t}、そこに ${o} を たそう` : '10の まとまりで かんがえよう'}; }
    if(p.op === 'mul') return p.a * p.b <= 30 ? {text:`${p.a}こ が ${p.b}れつ`, grid:[p.a, p.b]} : {text:`${p.a} × ${p.b - 1} ＝ ${p.a * (p.b - 1)}、そこに ${p.a} を たそう`};
    if(p.op === 'div') return {text:`${p.b} × □ ＝ ${p.a}　□ は いくつ？`};
  },
  digit:(x, p) => Math.floor(x / 10 ** p) % 10,
  carries(a, b){ const c = [0]; for(let p = 0; p < 3; p++) c[p + 1] = Math.floor((Logic.digit(a, p) + Logic.digit(b, p) + c[p]) / 10); return c; },
  stars:misses => misses === 0 ? 3 : misses <= 2 ? 2 : 1,
};

/* ================================================================
   2) ゲームデータ：コース・ステージ・保存
   ================================================================ */
const COURSES = [
  {id:'k4',   type:'add4',   name:'はじめての たしざん', age:'4さい',   icon:'🌱', bg:'bg-meadow',  hue:110, enemy:'くさ'},
  {id:'k5',   type:'add5',   name:'10までの たしざん',   age:'5さい',   icon:'🌻', bg:'bg-forest',  hue:45,  enemy:'もり'},
  {id:'a200', type:'add200', name:'200までの たしざん',  age:'6さい',   icon:'🏜', bg:'bg-desert',  hue:25,  enemy:'すな'},
  {id:'mul',  type:'mul',    name:'くくの とう',         age:'6さい',   icon:'🗼', bg:'bg-sky',     hue:255, enemy:'そら'},
  {id:'div',  type:'div',    name:'わりざんの どうくつ', age:'6さい',   icon:'💎', bg:'bg-cave',    hue:290, enemy:'やみ'},
  {id:'mix',  type:'mix',    name:'まぜまぜ かざん',     age:'6さい',   icon:'🌋', bg:'bg-volcano', hue:5,   enemy:'ほのお'},
  {id:'h22',  type:'h22',    name:'ひっさんの こおり',   age:'ひっさん', icon:'❄️', bg:'bg-ice',    hue:195, enemy:'こおり'},
  {id:'h32',  type:'h32',    name:'ひっさんの おしろ',   age:'ひっさん', icon:'🏰', bg:'bg-castle', hue:330, enemy:'まおう'},
];
const WORLDS = {
  'bg-meadow': {sky1:'#8fd3ff', sky2:'#e3f6ff', hill1:'#9ad97a', hill2:'#7cc865', ground:'#6fc05a', sunc:'#ffd23f', glow:'rgba(255,220,100,.55)', cloud:'#fff', deco:['🌷','🌼','🌳','🌷','🦋','🌼']},
  'bg-forest': {sky1:'#9fe0b8', sky2:'#eefbf0', hill1:'#4fae5c', hill2:'#3a9a4a', ground:'#3f9a4c', sunc:'#fff0a0', glow:'rgba(255,250,170,.5)', cloud:'#fff', deco:['🌲','🍄','🌳','🌲','🐿️','🍄']},
  'bg-desert': {sky1:'#ffc58f', sky2:'#fff1d6', hill1:'#f2c576', hill2:'#e8b25e', ground:'#e7b35f', sunc:'#ff9a3d', glow:'rgba(255,170,80,.6)', cloud:'#fff6e8', deco:['🌵','🐪','🌵','🏜️','🦂','🌵']},
  'bg-sky':    {sky1:'#9fb0ff', sky2:'#ece8ff', hill1:'#ffffff', hill2:'#f0edff', ground:'#e3ddff', sunc:'#ffe680', glow:'rgba(255,255,200,.6)', cloud:'#fff', deco:['🎈','🕊️','☁️','🪁','🎈','⭐'], float:true},
  'bg-cave':   {sky1:'#4a3a78', sky2:'#8a74c4', hill1:'#6a56a0', hill2:'#5a4890', ground:'#4e3f7e', sunc:'#c9f4ff', glow:'rgba(160,230,255,.5)', cloud:'#9a88d0', deco:['💎','🕯️','🦇','💎','🍄','💠']},
  'bg-volcano':{sky1:'#ff9a7a', sky2:'#ffe0d0', hill1:'#a8604a', hill2:'#8e4c3a', ground:'#7a4434', sunc:'#ff5a3d', glow:'rgba(255,100,60,.6)', cloud:'#d8b8b0', deco:['🌋','🔥','🪨','🔥','🌋','🪨']},
  'bg-ice':    {sky1:'#a8d4ff', sky2:'#f2f9ff', hill1:'#e6f3ff', hill2:'#d2e9ff', ground:'#cfe6fb', sunc:'#fff6c0', glow:'rgba(220,240,255,.7)', cloud:'#fff', deco:['⛄','❄️','🐧','🧊','❄️','🐧']},
  'bg-castle': {sky1:'#7d73c4', sky2:'#e3dfff', hill1:'#9b95b8', hill2:'#857f9f', ground:'#8d879f', sunc:'#fff2b0', glow:'rgba(255,240,180,.5)', cloud:'#efeaff', deco:['🏰','🚩','🦇','🕯️','🏰','👻']},
};
function buildScene(bg){
  const w = WORLDS[bg], el = $('battle');
  for(const k of ['sky1','sky2','hill1','hill2','ground','sunc','glow','cloud']) el.style.setProperty('--' + k, w[k]);
  $('scene').className = 'scene' + (w.float ? ' float' : '');
  const pos = [[4,46,2.6],[20,58,2],[76,44,2.8],[88,60,2.1],[36,64,1.6],[60,66,1.5]];
  $('deco').innerHTML = w.deco.map((e, i) => `<span style="--x:${pos[i][0]}%;--y:${pos[i][1]}%;--s:${pos[i][2]}rem;--d:${-i * .6}s">${e}</span>`).join('');
}
const STAGES = 5, Q_NORMAL = 5, Q_BOSS = 7;
const Save = {
  load(){ try{ return JSON.parse(localStorage.getItem('sansu-quest')) || {}; }catch(e){ return {}; } },
  store(){ try{ localStorage.setItem('sansu-quest', JSON.stringify(save)); }catch(e){} },
};
const save = Object.assign({stars:{}, sound:true, voice:true, coins:0}, Save.load());
const starsOf = (c, s) => save.stars[c + '-' + s] || 0;
const unlocked = (c, s) => s === 1 || starsOf(c, s - 1) > 0;
const totalStars = () => Object.values(save.stars).reduce((x, y) => x + y, 0);

/* ================================================================
   3) 音と声
   ================================================================ */
let AC;
function sfx(kind){
  if(!save.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type = 'sine', v = .22, t0 = 0, f2) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + t0);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + t0 + d);
      g.gain.setValueAtTime(v, t + t0); g.gain.exponentialRampToValueAtTime(.001, t + t0 + d);
      o.connect(g).connect(AC.destination); o.start(t + t0); o.stop(t + t0 + d + .02);
    };
    const noise = (d, fq, v = .4, t0 = 0, type = 'bandpass') => {
      const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), c = buf.getChannelData(0);
      for(let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = buf; f.type = type; f.frequency.value = fq; g.gain.value = v;
      s.connect(f).connect(g).connect(AC.destination); s.start(t + t0);
    };
    ({
      tap:  () => tone(660, .06, 'triangle', .12),
      slash:() => { noise(.18, 3000, .5, 0, 'highpass'); tone(900, .12, 'sawtooth', .08, 0, 300); },
      hit:  () => { tone(180, .2, 'square', .18, 0, 60); noise(.12, 600, .5); },
      crit: () => { tone(1200, .1, 'square', .12); tone(1600, .2, 'square', .12, .08); },
      miss: () => tone(240, .3, 'triangle', .2, 0, 120),
      hurt: () => { noise(.15, 300, .5); tone(120, .2, 'sawtooth', .15, 0, 70); },
      down: () => { tone(500, .5, 'sawtooth', .15, 0, 60); noise(.5, 500, .4); },
      win:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'triangle', .18, i * .11)),
      star: () => tone(1400, .15, 'sine', .16, 0, 2000),
      boom: () => { tone(110, .5, 'sawtooth', .25, 0, 30); noise(.5, 350, .5); },
      whoosh2:() => noise(.45, 1200, .45),
      land: () => { tone(140, .18, 'sine', .3, 0, 60); noise(.1, 400, .3); },
      crash:() => { noise(.35, 2500, .6, 0, 'highpass'); tone(90, .3, 'square', .2, 0, 40); },
      boing:() => tone(220, .45, 'sine', .3, 0, 660),
      pop:  () => tone(500, .08, 'sine', .25, 0, 900),
      ufo:  () => { tone(600, 1.2, 'sine', .12, 0, 900); tone(900, 1.2, 'sine', .08, .1, 600); },
      fanfare:() => [523, 523, 523, 784].forEach((f, i) => tone(f, i === 3 ? .5 : .14, 'square', .12, i * .16)),
      coin: () => { tone(988, .08, 'square', .1); tone(1319, .25, 'square', .1, .08); },
    })[kind]?.();
  }catch(e){}
}
function speak(t){
  if(!save.voice) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = .95; u.pitch = 1.3; speechSynthesis.speak(u); }catch(e){}
}

/* ================================================================
   4) 絵：ゆうしゃ（ほし）・スライム・なかま画像
   ================================================================ */
// キャラは「なかま」に よみこんだ 画像だけを つかう（オリジナルキャラは つかわない）
// 名前に「ボーボボ」「わるもの」「てき」が入った画像は てき役。てき役が いないときは なかま同士の しょうぶ。
const isVillain = m => /ボーボボ|ぼーぼぼ|わるもの|てき|敵/.test(m.name);

// なかま：この端末に保存した画像（IndexedDB）＋「キャラクター」フォルダの画像
const FOLDER = ['キュアハート.png','キュアダイヤモンド (1).png','キュアロゼった.png','image_main05 (1).png','キュアあるかな.png',
  'キュアアンサー.png','キュアエクレール.png','キュアフローラ.png','キュアマーメイド.png','キュアミススティック.png'];
const PARTY = [];
const nameOf = f => f.replace(/\.[^.]+$/, '').replace(/\s*\(\d+\)$/, '').trim();
function addMember(name, src){
  const i = new Image();
  i.onload = () => { if(!PARTY.some(m => m.name === name)){ PARTY.push({name, src}); renderParty(); if(!$('home').classList.contains('hide')) renderHome(); } };
  i.src = src;
}
const CharDB = {
  open(){ return this.p = this.p || new Promise(res => {
    try{ const r = indexedDB.open('tashizan-chars', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('chars', {keyPath:'name'});
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    }catch(e){ res(null); } }); },
  async all(){ const d = await this.open(); if(!d) return [];
    return new Promise(res => { try{ const q = d.transaction('chars').objectStore('chars').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }catch(e){ res([]); } }); },
  async put(rec){ const d = await this.open(); if(!d) return;
    return new Promise(res => { try{ const t = d.transaction('chars', 'readwrite'); t.objectStore('chars').put(rec); t.oncomplete = t.onerror = res; }catch(e){ res(); } }); },
};
CharDB.all().then(rs => rs.forEach(r => r.data && addMember(r.name, r.data)));
FOLDER.forEach(f => addMember(nameOf(f), 'キャラクター/' + f));
document.getElementById('charFiles').onchange = async e => {
  for(const f of [...e.target.files]){
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(f); });
    if(!data) continue;
    const name = nameOf(f.name); addMember(name, data); await CharDB.put({name, data});
  }
  e.target.value = '';
};
const heroes = () => PARTY.filter(m => !isVillain(m));
const villains = () => PARTY.filter(isVillain);
const imgOf = m => m ? `<img src="${m.src}" alt="">` : '';
const heroHTML = () => imgOf(pick(heroes().length ? heroes() : PARTY));

/* ================================================================
   5) 画面

const $ = id => document.getElementById(id);
const SCREENS = ['home', 'courses', 'stages', 'battle', 'party', 'settings'];

function renderSettings(){ document.querySelectorAll('[data-set]').forEach(t => t.classList.toggle('on', !!save[t.dataset.set])); }
document.querySelectorAll('[data-set]').forEach(t => t.onclick = () => { save[t.dataset.set] = !save[t.dataset.set]; Save.store(); renderSettings(); sfx('tap'); });

/* ================================================================
   6) バトル：正解＝こうげき、まちがい＝ヒント、HP0でクリア
   ================================================================ */
let B = null;
const later = (fn, ms) => { const id = B && B.id; setTimeout(() => { if(B && B.id === id) fn(); }, ms); };   // にげたら 予約を 止める
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
function startBattle(c, s){
  const boss = s === STAGES;
  B = {id:Math.random(), c, s, boss, total:boss ? Q_BOSS : Q_NORMAL, misses:0, combo:0, maxCombo:0, done:0};
  B.hp = B.total;
  $('battle').className = 'screen'; buildScene(c.bg); B.coins = 0; showCoins();
  $('bTitle').textContent = boss ? '👑 ボス バトル' : `ステージ ${s}`;
  const hero = pick(heroes().length ? heroes() : PARTY), vs = villains();
  const foe = vs.length ? pick(vs) : pick(PARTY.filter(m => m !== hero));
  $('eName').textContent = foe ? (vs.length ? (boss ? '👑 ' : '') + foe.name : 'ライバル：' + foe.name) : '';
  $('eName').classList.toggle('hide', !foe); $('hpbar').classList.toggle('hide', !foe);
  const en = $('enemy'); en.className = 'enemy'; en.innerHTML = imgOf(foe);
  $('heroBox').className = 'hero-box'; $('heroBox').innerHTML = imgOf(hero);
  $('answers').innerHTML = ''; $('eq').innerHTML = ''; $('pics').innerHTML = ''; $('hint').textContent = '';
  updateHp(); updateCombo();
  show('battle');
  speak(boss ? 'ボスが あらわれた！' : 'モンスターが あらわれた！');
  later(nextQuestion, 800);
}
$('flee').onclick = () => { stopClip(); B = null; $('fxl').innerHTML = ''; try{ speechSynthesis.cancel(); }catch(e){} sfx('tap'); openCourse(course); };
function updateHp(){
  const r = B.hp / B.total; $('hpfill').style.width = (r * 100) + '%';
  $('hpbar').classList.toggle('low', r <= .34);
  $('qcount').textContent = `もんだい ${Math.min(B.done + 1, B.total)} / ${B.total}`;
}
function updateCombo(){ $('bCombo').textContent = B.combo >= 2 ? `🔥${B.combo}` : ''; }

function nextQuestion(){
  const p = B.p = Logic.gen(B.c.type);
  B.first = true; B.locked = false;
  $('hint').innerHTML = '';
  updateHp();
  const item = pick(['🍎', '🍓', '🍩', '⭐', '🐟', '🍪', '🌸', '🎈']);
  $('pics').innerHTML = p.pics ? `<div class="grp">${item.repeat(p.a)}</div><span>＋</span><div class="grp">${item.repeat(p.b)}</div>` : '';
  const hs = !!p.hissan;
  $('eq').classList.toggle('hide', hs); $('hs').classList.toggle('hide', !hs);
  $('answers').classList.toggle('hide', hs); $('pad').classList.toggle('hide', !hs);
  if(hs){ renderHissan(); speak(`${p.a} たす ${p.b}。 いちの くらいから`); return; }
  $('eq').innerHTML = `${p.a} ${SYM[p.op]} ${p.b} ＝ <span class="q">？</span>`;
  const box = $('answers'); box.innerHTML = '';
  Logic.choices(p).forEach(v => {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = v;
    b.onclick = () => answer(b, v);
    box.append(b);
  });
  speak(`${p.a} ${WORD[p.op]} ${p.b} は？`);
}
function answer(btn, v){
  if(!B || B.locked || btn.disabled) return;
  if(v === B.p.ans){
    B.locked = true; btn.classList.add('ok');
    $('eq').innerHTML = `${B.p.a} ${SYM[B.p.op]} ${B.p.b} ＝ <span class="q">${B.p.ans}</span>`;
    attack();
  }else{ btn.disabled = true; btn.classList.add('ng'); wrong(); }
}
function wrong(){
  B.misses++; B.first = false; B.combo = 0; updateCombo();
  sfx('miss'); later(() => sfx('hurt'), 150);
  replay($('enemy'), 'attack'); replay($('heroBox'), 'hurt');
  const h = Logic.hint(B.p);
  if(h){
    let html = `💡 ${h.text}`;
    if(h.dots) html += `<div class="dots">${'●'.repeat(h.dots[0])}　<span style="color:var(--gold)">${'●'.repeat(h.dots[1])}</span></div>`;
    if(h.grid) html += `<div class="dots" style="flex-direction:column;align-items:center">${Array.from({length:h.grid[1]}, () => `<div>${'●'.repeat(h.grid[0])}</div>`).join('')}</div>`;
    $('hint').innerHTML = html;
  }
  speak('おしい！ ヒントを みてね');
}
function attack(){
  if(B.first){ B.combo++; B.maxCombo = Math.max(B.maxCombo, B.combo); }
  updateCombo();
  const crit = B.first && B.combo >= 3;
  replay($('heroBox'), 'atk'); sfx('slash');
  later(() => {
    replay($('slash'), 'on'); replay($('enemy'), 'hit');
    const dm = $('dmg'); dm.textContent = crit ? 'クリティカル！' : pick(['ズバッ！', 'ドカッ！', 'バシッ！']);
    dm.style.fontSize = crit ? '1.7rem' : ''; replay(dm, 'on');
    if(crit){ const cf = $('comboFx'); cf.textContent = `🔥 ${B.combo} コンボ！`; replay(cf, 'on'); sfx('crit'); }
    sfx('hit');
    B.hp--; B.done++; updateHp();
    reward(B.first ? B.combo : 0, B.hp <= 0);
  }, 250);
  B.ok = (B.ok || 0) + 1;
  const vid = CAN_YT && B.hp > 1 && B.ok % 3 === 0;
  later(() => {
    $('comboFx').classList.remove('on');
    if(B.hp <= 0) return defeat();
    if(vid){ const id = B.id; playClip(pick(CLIPS), () => { if(B && B.id === id) nextQuestion(); }); }
    else nextQuestion();
  }, vid ? 1900 : 1500);
}

/* ---- ひっ算（一のくらいから1けたずつ） ---- */
function renderHissan(){
  const p = B.p, D = String(p.ans).length;
  p.dig = D; p.pos = 0; p.car = Logic.carries(p.a, p.b);
  const d = (x, i) => x >= 10 ** (2 - i) ? Logic.digit(x, 2 - i) : '';
  let h = '<div class="cy"></div>' + [0, 1, 2].map(i => `<div class="cy" id="cy${i}"></div>`).join('');
  h += '<div></div>' + [0, 1, 2].map(i => `<div>${d(p.a, i)}</div>`).join('');
  h += '<div>＋</div>' + [0, 1, 2].map(i => `<div>${d(p.b, i)}</div>`).join('');
  h += '<div class="ln"></div><div></div>' + [0, 1, 2].map(i => `<div class="bx ${2 - i >= D ? 'off' : ''}" id="bx${i}"></div>`).join('');
  $('hs').innerHTML = h; markBox();
  $('hint').textContent = 'いちの くらいから たそう！';
}
function markBox(){ for(let i = 0; i < 3; i++) $('bx' + i).classList.toggle('on', 2 - i === B.p.pos && B.p.pos < B.p.dig); }
$('pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button class="btn" data-d="${d}">${d}</button>`).join('');
$('pad').onclick = e => {
  const b = e.target.closest('[data-d]'); if(!b || !B || B.locked || !B.p || !B.p.hissan) return;
  const p = B.p, d = +b.dataset.d, box = $('bx' + (2 - p.pos));
  if(d === Logic.digit(p.ans, p.pos)){
    sfx('tap'); box.textContent = d;
    const c = p.car[p.pos + 1];
    $('hint').textContent = c && p.pos + 1 < p.dig ? `くりあがり ${c}！` : 'その ちょうし！';
    if(c && p.pos + 1 < p.dig) $('cy' + (1 - p.pos)).textContent = c;
    p.pos++;
    markBox();
    if(p.pos >= p.dig){ B.locked = true; attack(); }
  }else{
    replay(box, 'ng'); wrong();
    const da = Logic.digit(p.a, p.pos), db = Logic.digit(p.b, p.pos), c = p.car[p.pos];
    $('hint').textContent = `💡 ${da} ＋ ${db}${c ? ' ＋ ' + c : ''} の いちばん みぎの かず`;
  }
};

/* ---- たおした → リザルト ---- */
function defeat(){

}

  const close = () => { stopClip(); stopFireworks(); $('overlay').classList.add('hide'); };

/* ================================================================
   7) ごほうび演出：正解のたびに ちがう パターン。連続正解で ごうかに。
      演出は #fxl（さわれない レイヤー）で 動くので、つぎの もんだいは すぐ とける。

const fxl = $('fxl');
function fxAdd(cls, html, ms, style){
  const d = document.createElement('div'); d.className = 'fx ' + cls; d.innerHTML = html || '';
  if(style) d.setAttribute('style', style);
  fxl.append(d); setTimeout(() => d.remove(), ms); return d;
}
const member = () => PARTY.length ? pick(PARTY) : null;
const memberHTML = imgOf;
const SAYS = ['やったね！', 'てんさい！', 'すごーい！', 'ナイス！', 'かんぺき！', 'いえーい！'];
function word(t, cls){ fxAdd('fx-word' + (cls ? ' ' + cls : ''), '', 1400).textContent = t; }
function confetti(n){
  const cols = ['#ff5a6e', '#ffd23f', '#43a6ff', '#3ec46d', '#ff8a3d', '#b07cff'];
  for(let i = 0; i < n; i++) fxAdd('cf', '', 2600, `--x:${rnd(0, 100)}%;--c:${pick(cols)};--t:${(1.4 + Math.random()).toFixed(2)}s;--d:${(Math.random() * .3).toFixed(2)}s;--dx:${rnd(-60, 60)}px;--r:${rnd(360, 1080)}deg`);
}
function shock(y){ fxAdd('shock', '', 700, `--y:${y || 40}%`); }
function sparks(x, y, n, ch){
  const d = fxAdd('sparks', '', 900, `left:${x}%;top:${y}%`);
  for(let i = 0; i < n; i++){ const a = Math.PI * 2 * i / n, r = rnd(60, 120);
    d.insertAdjacentHTML('beforeend', `<span style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px">${ch || '⭐'}</span>`); }
}
function sceneFx(cls){ const sc = $('scene'); sc.classList.remove(cls); void sc.offsetWidth; sc.classList.add(cls); setTimeout(() => sc.classList.remove(cls), 800); }
function actor(cls, m, extra, ms){
  if(!m) return fxAdd('hide', '', 10);
  const a = fxAdd('fx-actor ' + cls, memberHTML(m) + (extra || ''), ms || 2000);
  return a;
}
const PATTERNS = {
  tobi(){ actor('p-tobi', member(), `<div class="say">${pick(SAYS)}</div>`, 1800); sfx('whoosh2'); setTimeout(() => { sfx('land'); sparks(50, 48, 8, '💨'); }, 680); },
  yaburi(){
    const d = fxAdd('p-yaburi', `<svg class="hole" viewBox="0 0 200 200"><path d="M100 4 L118 52 L170 30 L150 80 L196 100 L150 120 L170 170 L118 148 L100 196 L82 148 L30 170 L50 120 L4 100 L50 80 L30 30 L82 52Z" fill="#fff8e7" stroke="#3b2a1e" stroke-width="6" stroke-linejoin="round"/></svg>`, 1900, 'inset:0');
    d.append(Object.assign(document.createElement('div'), {className:'fx fx-actor', innerHTML:memberHTML(member())}));
    word('バリーン！'); sfx('crash'); sceneFx('flash');
  },
  kyodai(){ actor('p-kyodai', member(), '', 1900); setTimeout(() => { word('ででーん！'); sfx('boing'); }, 500); },
  run(){
    const ms = shuffle(PARTY).slice(0, 3); const list = ms;
    list.forEach((m, i) => setTimeout(() => { actor('p-run', m, i === 0 ? `<div class="say">わーい！</div>` : '', 2000); sfx('pop'); }, i * 260));
  },
  manga(){
    fxAdd('manga', '', 1400); actor('p-manga', member(), '', 1400); word(pick(['ドーン！！', 'ガーン！！', 'ズギャーン！']), 'manga-word');
    sfx('crash');
  },
  hyokko(){ actor('p-hyokko', member(), `<div class="say">${pick(['ばあ！', 'みーつけた！', 'えへへ'])}</div>`, 1800); sfx('pop'); },
  kuru(){ actor('p-kuru', member(), '', 1800); sfx('whoosh2'); word('くるくる〜！'); },
  pyon(){ actor('p-pyon', member(), '', 1900); [0, 475, 950, 1425].forEach(t => setTimeout(() => sfx('pop'), t)); },
  buni(){ actor('p-buni', member(), '', 1700); word('ぶにゅ〜ん'); sfx('boing'); },
  hanage(){
    const r = $('enemy').getBoundingClientRect();
    if(!r.width) return PATTERNS.tobi();
    fxAdd('hanage', `<svg viewBox="0 0 40 400" preserveAspectRatio="none" width="44" height="100%"><path d="M20 0 C36 30 4 50 20 80 C36 110 4 130 20 160 C36 190 4 210 20 240 C36 270 4 290 20 320 C34 345 6 365 20 400" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg>`,
      1600, `--x:${r.left + r.width / 2}px;--h:${r.top + r.height * .3}px`);
    replay($('enemy'), 'yank'); setTimeout(() => $('enemy').classList.remove('yank'), 1600);

  parade(){
    const list = shuffle(PARTY).slice(0, 5); if(!list.length) return;
    const w = 100 / list.length;
    list.forEach((m, i) => setTimeout(() => { const a = actor('p-parade', m, '', 2200); a.style.left = (w * i + w / 2) + '%'; a.style.marginLeft = 'min(-14vw,-75px)'; }, i * 120));
    word('みんな しゅうごう！'); sfx('fanfare');
  },
};
const NORMAL = ['tobi', 'yaburi', 'kyodai', 'run', 'manga', 'hyokko', 'kuru', 'pyon', 'buni', 'hanage', 'ufo'];
let lastP = '';
function reward(combo, finalHit){
  sceneFx('pulse');
  let key;
  if(combo >= 5 && combo % 5 === 0) key = 'parade';                       // 5れんぞく ごとに みんな しゅうごう
  else { const pool = NORMAL.filter(k => k !== lastP && !(finalHit && k === 'hanage')); key = pick(pool); }
  lastP = key; PATTERNS[key]();
  confetti(combo >= 5 ? 46 : combo >= 3 ? 28 : 14);
  if(combo >= 3){ shock(38); sceneFx('flash'); }
  const gain = 10 + Math.min(combo, 5) * 2;
  B.coins += gain; save.coins = (save.coins || 0) + gain; Save.store();
  fxAdd('coinfly', '', 1000).textContent = `+${gain} 🪙`;
  setTimeout(() => { showCoins(); replay($('coins'), 'bump'); sfx('coin'); }, 900);

/* ---- 花火（ボスは30秒） ---- */
let fwRun = 0;
function fireworks(ms){
  const run = ++fwRun, cv = $('fw'), x = cv.getContext('2d'), until = performance.now() + ms;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = 'block'; x.clearRect(0, 0, cv.width, cv.height);
  const parts = []; let last = 0, n = 0;
  const burst = () => {
    const cx = cv.width * (.1 + Math.random() * .8), cy = cv.height * (.08 + Math.random() * .35), hue = rnd(0, 360), k = rnd(50, 90);
    for(let i = 0; i < k; i++){ const a = Math.PI * 2 * i / k, v = 2 + Math.random() * 4.5;
      parts.push({x:cx, y:cy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:60 + rnd(0, 40), hue:hue + rnd(-20, 20)}); }
    if(n++ % 3 === 0) sfx('boom');
  };
  const tick = ts => {
    if(run !== fwRun) return;
    if(ts < until && ts - last > 420){ last = ts; burst(); }
    x.globalCompositeOperation = 'destination-out'; x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(0, 0, cv.width, cv.height);
    x.globalCompositeOperation = 'lighter';
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.vy *= .985;
      if(--p.life <= 0){ parts.splice(i, 1); continue; }
      x.fillStyle = `hsla(${p.hue},100%,${55 + p.life / 4}%,${Math.min(1, p.life / 40)})`;
      x.beginPath(); x.arc(p.x, p.y, 2.6, 0, 7); x.fill();
    }
    if(ts < until || parts.length) requestAnimationFrame(tick); else cv.style.display = 'none';
  };
  requestAnimationFrame(tick);
}
function stopFireworks(){ fwRun++; $('fw').style.display = 'none'; }
