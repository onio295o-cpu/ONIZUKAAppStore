<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>たしざんあそび</title>
<style>
  :root{--bg:#fff7d6;--ink:#4a3b2a;--pink:#ff7aa8;--blue:#4cb8ff;--green:#5fd068;--yellow:#ffc933}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;min-height:100vh;background:linear-gradient(#fff7d6,#ffe6f1) fixed;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    display:flex;justify-content:center}
  #app{width:100%;max-width:640px;padding:16px;display:flex;flex-direction:column;gap:14px;text-align:center}
  h1{margin:8px 0 0;font-size:clamp(1.6rem,7vw,2.2rem);color:var(--pink);white-space:nowrap}
  .sub{margin:0;font-size:1.2rem}
  .btn{border:none;border-radius:24px;font:inherit;font-weight:bold;color:#fff;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .age{display:block;width:100%;font-size:2rem;padding:20px;margin:10px 0}
  .age small{display:block;font-size:1rem;font-weight:normal}
  .a4{background:var(--green)}.a5{background:var(--blue)}.a6{background:var(--pink)}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:1.3rem}
  .home{background:var(--yellow);font-size:1.1rem;padding:10px 16px;color:var(--ink)}
  .stars{font-size:1.4rem}
  .bar{height:14px;background:#fff;border-radius:7px;overflow:hidden;border:2px solid var(--ink)}
  .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .card{background:#fff;border-radius:28px;padding:18px 10px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
  .eq{font-size:3.4rem;font-weight:bold;letter-spacing:.05em}
  .eq .q{color:var(--pink)}
  .pics{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:2.2rem;min-height:60px}
  .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:42%}
  .plus{font-size:2.6rem;font-weight:bold}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .choice{font-size:3rem;padding:18px 0;background:var(--blue)}
  .choice.ng{background:#bbb;transform:scale(.92)}
  .choice.ok{background:var(--green)}
  #msg{min-height:2.2rem;font-size:1.7rem;font-weight:bold}
  .big{font-size:5rem}
  .hide{display:none!important}
  .mascot .brow{opacity:0}
  .mascot{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-top:6px}
  .mascot svg{width:110px;height:auto;animation:bounce .6s infinite alternate;filter:drop-shadow(0 5px 3px rgba(0,0,0,.2))}
  .mascot .say{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 12px;font-weight:bold;font-size:1.1rem;margin-bottom:60px}
  #stage{position:fixed;inset:0;z-index:50;overflow:hidden;background:linear-gradient(#6ec9ff,#d9f4ff 62%)}
  #sky span{position:absolute;transition:opacity 1s}
  #sky .sun{right:6%;top:6%;font-size:3.6rem;animation:spin 20s linear infinite}
  #sky .cloud{font-size:3.4rem;opacity:.9;animation:drift 18s linear infinite}
  #sky .c1{top:30%;left:-15%}#sky .c2{top:44%;left:-15%;font-size:2.4rem;animation-duration:26s;animation-delay:-10s}
  #sky .c3{top:52%;left:-15%;font-size:2.8rem;animation-duration:22s;animation-delay:-4s}
  @keyframes drift{to{transform:translateX(120vw)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  #stage.space #sky span{opacity:0}
  #spacebg{position:absolute;inset:0;opacity:0;transition:opacity 1s;
    background:radial-gradient(#fff 1px,transparent 2px) 0 0/38px 38px,radial-gradient(#ffe 1.5px,transparent 2px) 19px 19px/53px 53px,#0b0b30}
  #stage.space #spacebg{opacity:1}
  #park{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#7fdc62,#4fb847);transition:opacity 1s;font-size:4.5rem;
    border-top:6px solid #5ccd4a}
  #stage.space #park{opacity:0}
  #park span{position:absolute;bottom:55%;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
  #park .path{position:absolute;left:30%;right:30%;bottom:0;height:34%;background:#e9d29a;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.8}
  @keyframes sway{to{transform:rotate(4deg)}}
  .t1{left:4%}.t2{right:5%}.t5{left:20%;font-size:3rem!important;bottom:62%!important}
  .t3{left:30%;bottom:70%!important;font-size:2rem}.t4{right:28%;bottom:62%!important;font-size:2.2rem}.t6{left:8%;bottom:20%!important;font-size:1.8rem}
  #planets span{position:absolute;font-size:3.2rem;opacity:0;transition:opacity 1s;animation:float 3s ease-in-out infinite}
  #stage.space #planets span{opacity:1}
  @keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
  #nobi{position:absolute;left:50%;bottom:20%;width:160px;margin-left:-80px;z-index:2;transform-origin:50% 0;
    transition:transform 1.8s ease-in-out,margin-left .4s}
  #nobi.away{display:none}
  #nobi.side{margin-left:-125px}
  #nobi.fall{transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
  #nobi .boy{display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
  #nobi .kid{display:none;position:absolute;left:-78px;bottom:0;z-index:-1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
  #nobi.withkid .kid{display:block}
  #nobi.shake .boy{animation:shake .25s infinite}
  #nobi.shake .arm{animation:wave .2s infinite alternate}
  #nobi.withkid .kid{animation:shake .3s infinite}
  .arm{transform-box:fill-box;transform-origin:100% 0}
  @keyframes wave{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
  .mouth{transform-box:fill-box;transform-origin:center}
  #nobi.shake .mouth{animation:yell .25s infinite alternate}
  @keyframes yell{from{transform:scaleY(.5)}to{transform:scale(1.2,1.4)}}
  #mark{position:absolute;top:-6px;right:-6px;font-size:3rem;opacity:0}
  #nobi.shake #mark{opacity:1;animation:pop .3s infinite alternate}
  #nobi.hit .boy{transform:rotate(-22deg) translateX(-24px);transition:transform .08s}
  #cry{position:absolute;top:-4px;left:-6px;font-size:2.4rem;opacity:0}
  #nobi.hit #cry{opacity:1}
  #hero{position:absolute;bottom:20%;left:50%;margin-left:380px;width:140px;z-index:3;opacity:0;
    transition:margin-left .5s ease-out,opacity .3s,transform .12s}
  #hero.show{margin-left:40px;opacity:1}
  #hero.show svg{animation:bounce .5s infinite alternate;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
  #hero.slap{margin-left:-6px;transform:rotate(-6deg)}
  #hero.slap svg{animation:none}
  #hero .harm{transform-box:fill-box;transform-origin:100% 0}
  #hero.slap .harm{animation:slapArm .22s ease-out forwards}
  @keyframes slapArm{from{transform:rotate(70deg)}to{transform:rotate(-70deg)}}
  #hero .brow{opacity:0}#hero.angry .brow{opacity:1}
  #hero.angry .hsmile{d:path("M52 90 Q60 82 68 90")}
  @keyframes bounce{to{transform:translateY(-12px)}}
  #pow{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:2.6rem;font-weight:900;color:#ff3b3b;
    -webkit-text-stroke:2px #fff;paint-order:stroke fill;z-index:4;opacity:0;white-space:nowrap}
  #pow.on{animation:powpop .9s forwards}
  @keyframes powpop{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:1;transform:translateX(-50%) scale(1.3)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
  #bobo{position:absolute;top:0;left:50%;width:220px;margin-left:-110px;z-index:1;
    transform:translateY(-110%);transition:transform .6s ease-out}
  #bobo.show{transform:none}
  #bobo.defeated{transform:translateY(-130%) rotate(40deg);transition:transform .9s ease-in}
  #bobo img,#bobo svg#bobosvg{display:block;width:220px;height:auto}
  #bobo img{border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
  #hair{position:absolute;left:50%;margin-left:-20px;width:40px;height:0;overflow:hidden;transition:height .6s ease-in}
  #bubble{position:absolute;bottom:3%;left:50%;z-index:3;transform:translateX(-50%);width:max-content;max-width:88vw;
    background:#fff;border:4px solid var(--ink);border-radius:22px;padding:6px 18px 8px;font-size:1.7rem;font-weight:bold;text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.15)}
  #bubble .nm{display:block;font-size:1rem;color:#8a5a00;letter-spacing:.05em}
  #bubble.hero{background:#ffe3f1}#bubble.hero .nm{color:#d6307f}
  #bubble.bobo{background:#fff6a8}#bubble.boy .nm{color:#2d8b38}
  #bubble.kid{background:#efe4ff}#bubble.kid .nm{color:#6a3fb8}
  #clip{position:absolute;inset:0;z-index:5;background:#000;display:flex;align-items:center;justify-content:center}
  #clip iframe{width:100%;aspect-ratio:16/9;border:0}
  #skip{position:absolute;top:10px;right:10px;z-index:6;font-size:.9rem;padding:6px 12px;background:rgba(0,0,0,.45);box-shadow:none}
  .hs{display:grid;grid-template-columns:repeat(4,64px);justify-content:center;gap:4px 6px;
    font-size:3rem;font-weight:bold;font-variant-numeric:tabular-nums}
  .hs div{height:64px;display:flex;align-items:center;justify-content:center}
  .hs .cy{height:30px;font-size:1.5rem;color:var(--pink)}
  .hs .ln{height:6px;background:var(--ink);border-radius:3px;grid-column:1 / -1}
  .hs .bx{border:4px dashed #bbb;border-radius:14px;color:var(--green)}
  .hs .bx.on{border-color:var(--pink);background:#fff0f5}
  .hs .bx.off{border:none}
  .msgbox{min-height:2.2rem;font-size:1.7rem;font-weight:bold}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .pad .btn{font-size:2.2rem;padding:16px 0;background:var(--blue)}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .shake{animation:shake .3s}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <radialGradient id="hSkin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff0e3"/><stop offset="1" stop-color="#f6c9a8"/></radialGradient>
        <linearGradient id="hHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa6d6"/><stop offset="1" stop-color="#f26fb6"/></linearGradient>
        <linearGradient id="hDress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff86c0"/><stop offset="1" stop-color="#ee4c9b"/></linearGradient>
        <radialGradient id="hEye" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#b79bff"/><stop offset="1" stop-color="#5b2fd8"/></radialGradient>
      </defs></svg>
<div id="app">

  <section id="home">
    <h1>🍎 たしざんあそび 🍌</h1>
    <p class="sub">いくつ かな？ えらんでね！</p>
    <button class="btn age a4" data-lv="4">4さい<small>1〜5 の たしざん</small></button>
    <button class="btn age a5" data-lv="5">5さい<small>10 までの たしざん</small></button>
    <button class="btn age a6" data-lv="6">6さい<small>200 までの たしざん・くく・わりざん</small></button>
    <button class="btn age" style="background:#9b6bff" id="toH">✏️ ひっさん<small>2けた・3けた の たしざん</small></button>
    <div class="mascot"><span class="say">いっしょに<br>がんばろー！<br>ハッピー！</span></div>
  </section>

  <section id="hmode" class="hide">
    <h1>✏️ ひっさん</h1>
    <p class="sub">どれを やる？</p>
    <button class="btn age a4" data-h="22">2けた ＋ 2けた</button>
    <button class="btn age a5" data-h="32">3けた ＋ 2けた</button>
    <button class="btn age a6" data-h="mix">🌈 まぜまぜ</button>
    <button class="btn home" id="hmodeBack">← もどる</button>
  </section>

  <section id="hgame" class="hide">
    <div class="top">
      <button class="btn home" id="hback">← もどる</button>
      <span class="stars" id="hstars">⭐ 0</span>
    </div>
    <div class="bar"><i id="hprog"></i></div>
    <div class="card" style="margin-top:14px">
      <div class="hs" id="hs"></div>
    </div>
    <div id="hmsg" class="msgbox"></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="mode" class="hide">
    <h1>6さい</h1>
    <p class="sub">なにを やる？（たしざんは 200 まで）</p>
    <button class="btn age a4" data-op="add">➕ たしざん</button>
    <button class="btn age a5" data-op="mul">✖️ かけざん（くく）</button>
    <button class="btn age a6" data-op="div">➗ わりざん</button>
    <button class="btn age" style="background:var(--yellow);color:var(--ink)" data-op="mix">🌈 ぜんぶ まぜまぜ</button>
    <button class="btn home" id="modeBack">← もどる</button>
  </section>

  <section id="game" class="hide">
    <div class="top">
      <button class="btn home" id="back">← もどる</button>
      <span class="stars" id="stars">⭐ 0</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card" style="margin-top:14px">
      <div class="pics" id="pics"></div>
      <div class="eq" id="eq"></div>
    </div>
    <div id="msg"></div>
    <div class="choices" id="choices"></div>
    <div class="mascot"><span class="say">せいかいすると<br>いいこと あるよ♪</span></div>
  </section>

  <section id="end" class="hide">
    <div class="big">🎉</div>
    <h1>よくできました！</h1>
    <p class="sub" id="result"></p>
    <button class="btn age a4" id="again">もういっかい</button>
    <button class="btn age a5" id="toHome">さいしょへ</button>
  </section>
</div>

<div id="stage" class="hide">
  <div id="sky"><span class="sun">☀️</span><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="cloud c3">☁️</span></div>
  <div id="spacebg"></div>
  <div id="park">
    <span class="t1">🌳</span><span class="t2">🌳</span><span class="t5">🌲</span><span class="t3">🌷</span><span class="t4">🌻</span><span class="t6">🌼</span>
    <i class="path"></i>
  </div>
  <div id="planets"><span style="left:12%;top:18%">🪐</span><span style="left:76%;top:30%">🌙</span><span style="left:30%;top:55%">☄️</span><span style="left:70%;top:60%">👽</span><span style="left:50%;top:10%">⭐</span></div>
  <div id="bobo">
    <img id="bobopic" src="bobobo.png" alt="" onload="document.getElementById('bobosvg').style.display='none'" onerror="this.remove()">
    <svg id="bobosvg" viewBox="0 0 240 260" width="220">
      <defs>
        <radialGradient id="mon" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#b58cff"/><stop offset=".6" stop-color="#7a45d6"/><stop offset="1" stop-color="#4a238f"/></radialGradient>
      </defs>
      <g stroke="#2b1058" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

        <circle cx="120" cy="130" r="100" fill="url(#mon)"/>
        <ellipse cx="82" cy="108" rx="24" ry="22" fill="#fff"/><ellipse cx="158" cy="108" rx="24" ry="22" fill="#fff"/>
        <circle cx="88" cy="112" r="10" fill="#d81b3a" stroke="none"/><circle cx="152" cy="112" r="10" fill="#d81b3a" stroke="none"/>

        <path d="M62 196 Q120 178 178 196 Q168 244 120 248 Q72 244 62 196Z" fill="#5a0f2b"/>
        <path d="M74 198 l10 20 10 -18 M146 200 l10 18 10 -20" fill="#fff"/>
        <ellipse cx="120" cy="232" rx="22" ry="10" fill="#ff6f8f" stroke="none"/>
      </g>
    </svg>
    <div id="hair"><svg viewBox="0 0 40 400" preserveAspectRatio="none" width="40" height="100%"><path d="M20 0 C34 30 6 50 20 80 C34 110 6 130 20 160 C34 190 6 210 20 240 C34 270 6 290 20 320 C30 345 10 365 20 400" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/></svg></div>
  </div>
  <div id="bubble" class="hide"></div>

  <!-- めがねくん（オリジナル） -->
  <div id="nobi" class="away">
    <div id="mark">💢</div><div id="cry">💫</div>
    <svg class="kid" viewBox="0 0 150 176" width="140">
      <defs>
        <radialGradient id="kSkin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffdcb8"/><stop offset="1" stop-color="#e9a56f"/></radialGradient>
        <linearGradient id="kSweat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e5fd1"/><stop offset="1" stop-color="#5b36a0"/></linearGradient>
      </defs>
      <g stroke="#3d2a1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M20 112 L2 150" stroke-width="18" stroke="#3d2a1c"/><path d="M20 112 L2 150" stroke-width="14" stroke="#8e5fd1"/>
        <path d="M130 112 L148 150" stroke-width="18" stroke="#3d2a1c"/><path d="M130 112 L148 150" stroke-width="14" stroke="#8e5fd1"/>
        <ellipse cx="75" cy="130" rx="55" ry="42" fill="url(#kSweat)"/>
        <path d="M30 122 Q75 136 120 122 M26 138 Q75 152 124 138" fill="none" stroke="#c7a8f0" stroke-width="5" opacity=".7"/>
        <rect x="42" y="160" width="26" height="14" rx="6" fill="#4b3a2a"/><rect x="82" y="160" width="26" height="14" rx="6" fill="#4b3a2a"/>
        <ellipse cx="75" cy="68" rx="46" ry="44" fill="url(#kSkin)"/>
        <ellipse cx="30" cy="72" rx="7" ry="10" fill="#f1b88a"/><ellipse cx="120" cy="72" rx="7" ry="10" fill="#f1b88a"/>
        <path d="M30 56 Q30 12 75 10 Q120 12 120 56 Q112 44 98 42 Q75 30 52 42 Q38 44 30 56Z" fill="#d6342f"/>
        <path d="M28 52 Q75 66 122 52 L122 58 Q75 74 28 58Z" fill="#b82823"/>
        <path d="M20 60 Q75 78 130 60 Q132 70 120 70 Q75 82 30 70 Q18 70 20 60Z" fill="#b82823"/>
        <path d="M68 26 l3 7 7 .5 -5.5 4.5 2 7 -6.5 -4 -6.5 4 2 -7 -5.5 -4.5 7 -.5z" fill="#ffd23f" stroke="#a87a00" stroke-width="1.5"/>
        <path d="M44 74 Q50 70 58 76 M92 76 Q100 70 106 74" fill="none" stroke-width="4"/>
        <circle cx="54" cy="84" r="4" fill="#222" stroke="none"/><circle cx="96" cy="84" r="4" fill="#222" stroke="none"/>
        <path d="M70 98 Q75 104 80 98" fill="none" stroke="#b5764a" stroke-width="2.5"/>
        <ellipse class="mouth" cx="75" cy="112" rx="15" ry="10" fill="#8c1c24"/>
        <path d="M62 105 Q75 108 88 105" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="butt"/>
        <circle cx="42" cy="98" r="6" fill="#ff9aa5" opacity=".55" stroke="none"/><circle cx="108" cy="98" r="6" fill="#ff9aa5" opacity=".55" stroke="none"/>
      </g>
    </svg>
    <svg class="boy" viewBox="0 0 120 176" width="160">
      <defs>
        <radialGradient id="bSkin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3c4"/><stop offset="1" stop-color="#eaa877"/></radialGradient>
        <linearGradient id="bShirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63cc67"/><stop offset="1" stop-color="#2d8b38"/></linearGradient>
        <radialGradient id="bHair" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#94613a"/><stop offset="1" stop-color="#45280f"/></radialGradient>
      </defs>
      <g stroke="#3d2a1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <g class="arm l"><path d="M32 100 L12 130" stroke-width="15"/><path d="M32 100 L12 130" stroke="#f1c08f" stroke-width="10.5"/></g>
        <g class="arm r"><path d="M88 100 L108 130" stroke-width="15"/><path d="M88 100 L108 130" stroke="#f1c08f" stroke-width="10.5"/></g>
        <rect x="42" y="146" width="12" height="18" fill="#fff"/><rect x="66" y="146" width="12" height="18" fill="#fff"/>
        <rect x="38" y="160" width="20" height="9" rx="4" fill="#e53935"/><rect x="62" y="160" width="20" height="9" rx="4" fill="#e53935"/>
        <rect x="34" y="124" width="52" height="28" rx="7" fill="#7a5238"/>

<script>
const TOTAL = 10;
const LEVELS = {
  4: {max:5,  sum:5,  pics:true},
  5: {max:9,  sum:10, pics:true},
  6: {max:150, sum:200, pics:false}
};
const ITEMS = ['🍎','🍌','🍓','🐶','🐱','🚗','🌸','🐟','🍪','⚽'];
const PRAISE = ['すごい！','せいかい！','てんさい！','やったね！','かしこい！'];

const $ = id => document.getElementById(id);
const show = id => ['home','mode','game','hgame','hmode','end'].forEach(s => $(s).classList.toggle('hide', s !== id));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;

let lastRun, lv, op, n, score, cur, locked, miss;
const SYM = {add:'＋', mul:'×', div:'÷'};
const WORD = {add:'たす', mul:'かける', div:'わる'};

function speak(t, pitch){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP'; u.rate = .9; u.pitch = pitch || 1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}

function start(level, o){
  okCount = 0; lv = level; op = o || 'add'; lastRun = () => start(level, o); n = 0; score = 0;
  show('game'); next();
}

function next(){
  if(n >= TOTAL) return finish();
  const L = LEVELS[lv];
  const kind = (lv === 6 && op === 'mix') ? ['add','mul','div'][rnd(0,2)] : op;
  let a, b, ans, max = L.sum;
  if(kind === 'add'){
    do{
      a = rnd(lv === 6 ? 11 : 1, L.max); b = rnd(lv === 6 ? 11 : 1, lv === 6 ? 100 : L.max);
    }while(a + b > L.sum);
    ans = a + b;
  }else if(kind === 'mul'){
    a = rnd(1, 9); b = rnd(1, 9); ans = a * b; max = 81;
  }else{
    b = rnd(2, 9); ans = rnd(1, 9); a = b * ans; max = 9;
  }
  cur = {a, b, kind, ans};
  locked = false; miss = 0;
  $('msg').textContent = '';
  $('prog').style.width = (n / TOTAL * 100) + '%';
  $('stars').textContent = '⭐ ' + score;

  const item = ITEMS[rnd(0, ITEMS.length - 1)];
  $('pics').innerHTML = (L.pics && kind === 'add')
    ? `<div class="grp">${item.repeat(a)}</div><span class="plus">＋</span><div class="grp">${item.repeat(b)}</div>`
    : '';
  $('eq').innerHTML = `${a} ${SYM[kind]} ${b} ＝ <span class="q">？</span>`;
  speak(`${a} ${WORD[kind]} ${b} は？`);

  const set = new Set([ans]);
  const near = (kind === 'add' && lv === 6) ? [ans-10, ans+10, ans-1, ans+1, ans-2, ans+2] : kind === 'mul' ? [a*(b+1), a*(b-1), (a+1)*b, (a-1)*b] : [];
  while(set.size < 3){
    let w = near.length && Math.random() < .8 ? near[rnd(0, near.length - 1)] : ans + rnd(-3, 3);
    if(w >= 0 && w <= max && w !== ans) set.add(w);
    else if(set.size < 3 && Math.random() < .2) set.add(rnd(0, max));
  }
  const box = $('choices'); box.innerHTML = '';
  [...set].sort(() => Math.random() - .5).forEach(v => {
    const el = document.createElement('button');
    el.className = 'btn choice'; el.textContent = v;
    el.onclick = () => answer(el, v, cur.ans);
    box.appendChild(el);
  });
}

function answer(el, v, ans){
  if(locked) return;
  if(v === ans){
    locked = true;
    el.classList.add('ok','pop');
    if(miss === 0) score++;
    const p = PRAISE[rnd(0, PRAISE.length - 1)];
    $('msg').textContent = '🎉 ' + p;
    $('eq').innerHTML = `${cur.a} ${SYM[cur.kind]} ${cur.b} ＝ <span class="q">${ans}</span>`;
    $('stars').textContent = '⭐ ' + score;
    n++; sfx('ding');
    setTimeout(() => reaction(next), 700);
  }else{
    miss++;
    el.classList.add('ng','shake');
    el.disabled = true;
    $('msg').textContent = 'おしい！ もういちど！'; sfx('miss');
    speak('おしい、もういちど');
  }
}

function finish(){
  $('prog').style.width = '100%';
  show('end');
  const s = '⭐'.repeat(score) || '🌱';
  $('result').innerHTML = `${TOTAL}もん ちゅう ${score}もん いっぱつで せいかい！<br><span style="font-size:2rem">${s}</span>`;
  speak('よくできました！');
}

document.querySelectorAll('.age[data-lv]').forEach(btn => {
  btn.onclick = () => +btn.dataset.lv === 6 ? show('mode') : start(+btn.dataset.lv);
});
document.querySelectorAll('.age[data-op]').forEach(btn => {
  btn.onclick = () => start(6, btn.dataset.op);
});
$('modeBack').onclick = () => show('home');
$('back').onclick = () => { try{speechSynthesis.cancel()}catch(e){} show('home'); };
$('again').onclick = () => lastRun();
$('toHome').onclick = () => show('home');

/* ---------- ひっ算 ---------- */
let hType, hA, hB, hAns, hDig, hCarry, hPos, hMiss, hLocked;
const dg = (x, p) => Math.floor(x / 10 ** p) % 10;

function hStart(t){
  hType = t; n = 0; score = 0; okCount = 0; lastRun = () => hStart(t);
  show('hgame'); hNext();
}

function hNext(){
  if(n >= TOTAL) return finish();
  const kind = hType === 'mix' ? (rnd(0, 1) ? '22' : '32') : hType;
  if(kind === '22'){ hA = rnd(10, 99); hB = rnd(10, 99); }
  else { hA = rnd(100, 899); hB = rnd(10, 99); }
  hAns = hA + hB;
  hDig = String(hAns).length;
  hCarry = [0];
  for(let p = 0; p < 3; p++) hCarry[p + 1] = Math.floor((dg(hA, p) + dg(hB, p) + hCarry[p]) / 10);
  hPos = 0; hMiss = 0; hLocked = false;
  $('hprog').style.width = (n / TOTAL * 100) + '%';
  $('hstars').textContent = '⭐ ' + score;
  $('hmsg').textContent = 'いちの くらいから！';

  // 列 i: 0=百 1=十 2=一（左から）
  let h = '<div class="cy"></div>';
  for(let i = 0; i < 3; i++) h += `<div class="cy" id="cy${i}"></div>`;
  h += '<div></div>' + [0,1,2].map(i => `<div>${hA >= 10 ** (2 - i) ? dg(hA, 2 - i) : ''}</div>`).join('');
  h += '<div>＋</div>' + [0,1,2].map(i => `<div>${hB >= 10 ** (2 - i) ? dg(hB, 2 - i) : ''}</div>`).join('');
  h += '<div class="ln"></div><div></div>';
  for(let i = 0; i < 3; i++) h += `<div class="bx ${2 - i >= hDig ? 'off' : ''}" id="bx${i}"></div>`;
  $('hs').innerHTML = h;
  hMark();
  speak(`${hA} たす ${hB}。 いちのくらいから たしてね`);
}

function hMark(){
  for(let i = 0; i < 3; i++) $('bx' + i).classList.toggle('on', 2 - i === hPos && hPos < hDig);
}

function hPress(d){
  if(hLocked) return;
  const box = $('bx' + (2 - hPos));
  if(d === dg(hAns, hPos)){
    box.textContent = d;
    const c = hCarry[hPos + 1];
    if(c && hPos + 1 < hDig){
      $('cy' + (2 - hPos - 1)).textContent = c;
      $('hmsg').textContent = `くりあがり ${c}！`;
    }else $('hmsg').textContent = 'そのちょうし！';
    hPos++;
    if(hPos >= hDig){
      hLocked = true;
      document.querySelectorAll('.bx.on').forEach(e => e.classList.remove('on'));
      if(hMiss === 0) score++;
      const p = PRAISE[rnd(0, PRAISE.length - 1)];
      $('hmsg').textContent = '🎉 ' + p;
      $('hstars').textContent = '⭐ ' + score;
      n++; sfx('ding');
      setTimeout(() => reaction(hNext), 700);
    }else hMark();
  }else{
    hMiss++;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    $('hmsg').textContent = 'おしい！ もういちど！'; sfx('miss');
    speak('おしい、もういちど');
  }
}

$('pad').innerHTML = [1,2,3,4,5,6,7,8,9,0].map(d => `<button class="btn" data-d="${d}">${d}</button>`).join('');
$('pad').onclick = e => { const b = e.target.closest('[data-d]'); if(b) hPress(+b.dataset.d); };
$('toH').onclick = () => show('hmode');
$('hmodeBack').onclick = () => show('home');
$('hback').onclick = () => { try{speechSynthesis.cancel()}catch(e){} show('home'); };
document.querySelectorAll('.age[data-h]').forEach(btn => btn.onclick = () => hStart(btn.dataset.h));

/* ---------- 効果音（WebAudio・ファイル不要） ---------- */
let AC;
function sfx(kind){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type = 'sine', v = .25, t0 = 0, f2) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + t0);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + t0 + d);
      g.gain.setValueAtTime(v, t + t0); g.gain.exponentialRampToValueAtTime(.001, t + t0 + d);
      o.connect(g).connect(AC.destination); o.start(t + t0); o.stop(t + t0 + d + .02);
    };
    const noise = (d, fq, v = .4, t0 = 0, type = 'bandpass') => {
      const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), c = buf.getChannelData(0);
      for(let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = buf; f.type = type; f.frequency.value = fq; g.gain.value = v;
      s.connect(f).connect(g).connect(AC.destination); s.start(t + t0);
    };
    if(kind === 'ding'){ tone(880, .25, 'sine', .22); tone(1320, .35, 'sine', .2, .12); }
    else if(kind === 'miss'){ tone(220, .25, 'triangle', .2, 0, 140); }
    else if(kind === 'slap'){ noise(.12, 2500, .8, 0, 'highpass'); tone(160, .15, 'square', .25, 0, 60); }
    else if(kind === 'whoosh'){ noise(.8, 900, .5); }
    else if(kind === 'boom'){ tone(140, .5, 'sawtooth', .35, 0, 35); noise(.4, 400, .6); }
    else if(kind === 'boing'){ tone(300, .35, 'sine', .3, 0, 700); }
    else if(kind === 'happy'){ [660, 880, 1100, 1320].forEach((f, i) => tone(f, .2, 'triangle', .18, i * .09)); }
  }catch(e){}
}

/* ---------- ごほうびシーン ---------- */
// 動画クリップ：YouTube の ID と、再生する区間（秒）。ここを書きかえれば好きな場面に変えられます
const CLIP = {id:'INbco2MQ1dM', start:0, end:8};
const BOY_RATE = window.BOY_RATE ?? .5;        // めがねくんが出る確率（出ない回はヒロインがほめるだけ）
let okCount = 0, stageId = 0, clipTok = 0;
const GAGS = ['だめーーー！','なんでよーーー！','あーーー！','ひどいよー！','うえーん！','ぼくの せいじゃないよー！','せいかいって なにさー！','やめてよーーー！'];
const CHEERS = ['ハッピー！ せいかい！','やったね！ ハッピー！','すごーい！ ハッピー！','ハッピー ハッピー！ だいせいかい！'];
const WHO = {boy:'めがねくん', hero:'ハピハピちゃん', kid:'どっしーくん', bobo:'ハナゲまじん'};
const VOICE = {boy:[1.6,.95], hero:[2,1.15], kid:[.7,.85], bobo:[.6,.9]};   // [pitch, rate]
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[rnd(0, a.length - 1)];

// 声が終わるまで待つ（声が出せない環境でも止まらないよう保険のタイマー付き）
function speakDone(t, pitch, rate){
  return new Promise(res => {
    let fin = false; const end = () => { if(!fin){ fin = true; res(); } };
    setTimeout(end, 1500 + t.length * 400);
    try{
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ja-JP'; u.rate = rate; u.pitch = pitch;
      u.onend = u.onerror = end;
      speechSynthesis.speak(u);
    }catch(e){}
  });
}

function playClip(){
  const tok = ++clipTok, box = $('clip');
  box.innerHTML = `<iframe src="https://www.youtube.com/embed/${CLIP.id}?autoplay=1&start=${CLIP.start}&end=${CLIP.end}&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  box.classList.remove('hide');
  return sleep((CLIP.end - CLIP.start + 1.5) * 1000).then(() => {
    if(tok === clipTok){ box.classList.add('hide'); box.innerHTML = ''; }
  });
}

function showPow(t){
  const p = $('pow'); p.textContent = t;
  p.classList.remove('on'); void p.offsetWidth; p.classList.add('on');
}

function resetStage(){
  clipTok++;
  $('stage').className = '';
  $('nobi').className = 'away'; $('nobi').style.transform = '';
  $('bobo').className = ''; $('bobo').style.marginLeft = '-110px';
  $('hero').className = '';
  $('pow').className = ''; $('pow').textContent = '';
  $('clip').classList.add('hide'); $('clip').innerHTML = '';
  const h = $('hair'); h.style.transition = 'none'; h.style.height = '0px';
  $('bubble').classList.add('hide');
}
function endStage(done){
  const st = $('stage');
  st.onclick = null; resetStage(); st.classList.add('hide');
  done();
}

async function reaction(done){
  okCount++;
  const id = ++stageId, alive = () => id === stageId;
  resetStage();
  const t0 = Date.now(), st = $('stage');
  st.onclick = () => { if(alive() && Date.now() - t0 > 900){ stageId++; endStage(done); } };
  const nobi = $('nobi'), hair = $('hair'), bobo = $('bobo'), hero = $('hero'), bub = $('bubble');
  const hasPic = $('bobosvg').style.display === 'none';
  const say = async (t, who) => {
    if(!alive()) return false;
    bub.textContent = '';
    if(who){ const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (who === 'bobo' && hasPic) ? 'ボーボボ' : WHO[who]; bub.append(nm); }
    bub.append(document.createTextNode(t));
    bub.className = who || '';
    const [p, r] = VOICE[who] || [1.2, .9];
    await Promise.all([speakDone(t, p, r), sleep(1100)]);
    return alive();
  };
  const finish = async () => { await sleep(300); if(alive()) endStage(done); };
  const space = okCount % 3 === 0;

  // めがねくんが出ない回：ヒロインがほめるだけ
  if(!space && Math.random() >= BOY_RATE){
    hero.classList.add('show');
    sfx('happy'); showPow('ハッピー！✨');
    await sleep(500);
    if(!await say(pick(CHEERS), 'hero')) return;
    return finish();
  }

  // めがねくん登場（すねて大さわぎ）
  nobi.classList.remove('away'); nobi.classList.add('shake');
  if(!space) nobi.classList.add('side');
  sfx('boing');
  if(!await say(pick(GAGS), 'boy')) return;

  if(!space){
    // ヒロインがおこってビンタ
    hero.classList.add('show', 'angry');
    await sleep(600);
    if(!await say('もう！ ずるいことしちゃ だめでしょー！ ぷんぷん！', 'hero')) return;
    nobi.classList.remove('shake');
    hero.classList.add('slap');
    await sleep(200);
    nobi.classList.add('hit'); showPow('パチーン！💥'); sfx('slap');
    if(!await say('えいっ！ ビンタ！', 'hero')) return;
    hero.classList.remove('slap', 'angry');
    if(!await say('いたいよー！ ごめんなさーい！', 'boy')) return;
    nobi.classList.remove('hit');
    sfx('happy');
    if(!await say('よくできました！ ハッピー！', 'hero')) return;
    return finish();
  }

  // 3回に1回：ハナゲの鼻毛で宇宙へ（どっしーくんも道づれ）→ ヒロインがやっつける
  nobi.classList.add('withkid');
  bobo.classList.add('show');
  await sleep(600);
  if(!await say('ハナゲしんけん！ いってこーい！', 'bobo')) return;
  const nx = hasPic ? .57 : .5, noseY = bobo.offsetHeight * (hasPic ? .76 : .654);
  bobo.style.marginLeft = -(nx * 220) + 'px';          // 鼻をめがねくんの真上にそろえる
  hair.style.left = (nx * 220 - 20) + 'px'; hair.style.marginLeft = '0';
  const dist = nobi.getBoundingClientRect().top + 10 - noseY;
  hair.style.top = noseY + 'px';
  hair.style.transition = 'height .6s ease-in'; hair.style.height = dist + 'px';
  await sleep(700);
  if(!alive()) return;
  sfx('whoosh');
  hair.style.transition = 'height 1.8s ease-in-out'; hair.style.height = '160px';
  nobi.style.transform = `translateY(${-(dist - 160)}px) rotate(720deg) scale(.6)`;
  st.classList.add('space');
  if(!await say('うわーーー！ たすけてーーー！', 'boy')) return;
  if(!await say('ぼくまで つれていかれるのー！？ ぎゃー！', 'kid')) return;
  hero.classList.add('show', 'angry');
  if(!await say('まてー！ ハナゲまじん！ わたしが やっつけるよ！', 'hero')) return;
  await playClip();
  if(!alive()) return;
  bobo.classList.remove('show'); bobo.classList.add('defeated'); showPow('ドカーン！✨'); sfx('boom');
  nobi.classList.add('fall'); nobi.style.transform = '';
  hair.style.transition = 'height .8s'; hair.style.height = '0px';
  st.classList.remove('space');
  if(!await say('おちるーーー！', 'boy')) return;
  nobi.classList.remove('fall', 'shake');
  hero.classList.remove('angry');
  if(!await say('ただいまー！ たすかったよー！', 'boy')) return;
  sfx('happy');
  if(!await say('やっつけたよ！ ハッピー！', 'hero')) return;
  return finish();
}
document.querySelectorAll('.mascot').forEach(m => m.insertAdjacentHTML('afterbegin', $('hero').querySelector('svg').outerHTML));
</script>
</body>
</html>
