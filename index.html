<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>たしざんあそび</title>
<style>
  :root{--bg:#fff7d6;--ink:#4a3b2a;--pink:#ff7aa8;--blue:#4cb8ff;--green:#5fd068;--yellow:#ffc933}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    display:flex;justify-content:center}
  #app{width:100%;max-width:640px;padding:16px;display:flex;flex-direction:column;gap:14px;text-align:center}
  h1{margin:8px 0 0;font-size:2.2rem;color:var(--pink)}
  .sub{margin:0;font-size:1.2rem}
  .btn{border:none;border-radius:24px;font:inherit;font-weight:bold;color:#fff;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .age{font-size:2rem;padding:22px;margin:6px 0}
  .age small{display:block;font-size:1rem;font-weight:normal}
  .a4{background:var(--green)}.a5{background:var(--blue)}.a6{background:var(--pink)}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:1.3rem}
  .home{background:var(--yellow);font-size:1.1rem;padding:10px 16px;color:var(--ink)}
  .stars{font-size:1.4rem}
  .bar{height:14px;background:#fff;border-radius:7px;overflow:hidden;border:2px solid var(--ink)}
  .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .card{background:#fff;border-radius:28px;padding:18px 10px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
  .eq{font-size:3.4rem;font-weight:bold;letter-spacing:.05em}
  .eq .q{color:var(--pink)}
  .pics{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:2.2rem;min-height:60px}
  .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:42%}
  .plus{font-size:2.6rem;font-weight:bold}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .choice{font-size:3rem;padding:18px 0;background:var(--blue)}
  .choice.ng{background:#bbb;transform:scale(.92)}
  .choice.ok{background:var(--green)}
  #msg{min-height:2.2rem;font-size:1.7rem;font-weight:bold}
  .big{font-size:5rem}
  .hide{display:none}
  .hs{display:grid;grid-template-columns:repeat(4,64px);justify-content:center;gap:4px 6px;
    font-size:3rem;font-weight:bold;font-variant-numeric:tabular-nums}
  .hs div{height:64px;display:flex;align-items:center;justify-content:center}
  .hs .cy{height:30px;font-size:1.5rem;color:var(--pink)}
  .hs .ln{height:6px;background:var(--ink);border-radius:3px;grid-column:1 / -1}
  .hs .bx{border:4px dashed #bbb;border-radius:14px;color:var(--green)}
  .hs .bx.on{border-color:var(--pink);background:#fff0f5}
  .hs .bx.off{border:none}
  .msgbox{min-height:2.2rem;font-size:1.7rem;font-weight:bold}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .pad .btn{font-size:2.2rem;padding:16px 0;background:var(--blue)}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .shake{animation:shake .3s}
</style>
</head>
<body>
<div id="app">

  <section id="home">
    <h1>🍎 たしざんあそび 🍌</h1>
    <p class="sub">いくつ かな？ えらんでね！</p>
    <button class="btn age a4" data-lv="4">4さい<small>1〜5 の たしざん</small></button>
    <button class="btn age a5" data-lv="5">5さい<small>10 までの たしざん</small></button>
    <button class="btn age a6" data-lv="6">6さい<small>200 までの たしざん・くく・わりざん</small></button>
    <button class="btn age" style="background:#9b6bff" id="toH">✏️ ひっさん<small>2けた・3けた の たしざん</small></button>
  </section>

  <section id="hmode" class="hide">
    <h1>✏️ ひっさん</h1>
    <p class="sub">どれを やる？</p>
    <button class="btn age a4" data-h="22">2けた ＋ 2けた</button>
    <button class="btn age a5" data-h="32">3けた ＋ 2けた</button>
    <button class="btn age a6" data-h="mix">🌈 まぜまぜ</button>
    <button class="btn home" id="hmodeBack">← もどる</button>
  </section>

  <section id="hgame" class="hide">
    <div class="top">
      <button class="btn home" id="hback">← もどる</button>
      <span class="stars" id="hstars">⭐ 0</span>
    </div>
    <div class="bar"><i id="hprog"></i></div>
    <div class="card" style="margin-top:14px">
      <div class="hs" id="hs"></div>
    </div>
    <div id="hmsg" class="msgbox"></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="mode" class="hide">
    <h1>6さい</h1>
    <p class="sub">なにを やる？（たしざんは 200 まで）</p>
    <button class="btn age a4" data-op="add">➕ たしざん</button>
    <button class="btn age a5" data-op="mul">✖️ かけざん（くく）</button>
    <button class="btn age a6" data-op="div">➗ わりざん</button>
    <button class="btn age" style="background:var(--yellow);color:var(--ink)" data-op="mix">🌈 ぜんぶ まぜまぜ</button>
    <button class="btn home" id="modeBack">← もどる</button>
  </section>

  <section id="game" class="hide">
    <div class="top">
      <button class="btn home" id="back">← もどる</button>
      <span class="stars" id="stars">⭐ 0</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card" style="margin-top:14px">
      <div class="pics" id="pics"></div>
      <div class="eq" id="eq"></div>
    </div>
    <div id="msg"></div>
    <div class="choices" id="choices"></div>
  </section>

  <section id="end" class="hide">
    <div class="big">🎉</div>
    <h1>よくできました！</h1>
    <p class="sub" id="result"></p>
    <button class="btn age a4" id="again">もういっかい</button>
    <button class="btn age a5" id="toHome">さいしょへ</button>
  </section>
</div>

<script>
const TOTAL = 10;
const LEVELS = {
  4: {max:5,  sum:5,  pics:true},
  5: {max:9,  sum:10, pics:true},
  6: {max:150, sum:200, pics:false}
};
const ITEMS = ['🍎','🍌','🍓','🐶','🐱','🚗','🌸','🐟','🍪','⚽'];
const PRAISE = ['すごい！','せいかい！','てんさい！','やったね！','かしこい！'];

const $ = id => document.getElementById(id);
const show = id => ['home','mode','game','hgame','hmode','end'].forEach(s => $(s).classList.toggle('hide', s !== id));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;

let lastRun, lv, op, n, score, cur, locked, miss;
const SYM = {add:'＋', mul:'×', div:'÷'};
const WORD = {add:'たす', mul:'かける', div:'わる'};

function speak(t){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP'; u.rate = .9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}

function start(level, o){
  lv = level; op = o || 'add'; lastRun = () => start(level, o); n = 0; score = 0;
  show('game'); next();
}

function next(){
  if(n >= TOTAL) return finish();
  const L = LEVELS[lv];
  const kind = (lv === 6 && op === 'mix') ? ['add','mul','div'][rnd(0,2)] : op;
  let a, b, ans, max = L.sum;
  if(kind === 'add'){
    do{
      a = rnd(lv === 6 ? 11 : 1, L.max); b = rnd(lv === 6 ? 11 : 1, lv === 6 ? 100 : L.max);
    }while(a + b > L.sum);
    ans = a + b;
  }else if(kind === 'mul'){
    a = rnd(1, 9); b = rnd(1, 9); ans = a * b; max = 81;
  }else{
    b = rnd(2, 9); ans = rnd(1, 9); a = b * ans; max = 9;
  }
  cur = {a, b, kind, ans};
  locked = false; miss = 0;
  $('msg').textContent = '';
  $('prog').style.width = (n / TOTAL * 100) + '%';
  $('stars').textContent = '⭐ ' + score;

  const item = ITEMS[rnd(0, ITEMS.length - 1)];
  $('pics').innerHTML = (L.pics && kind === 'add')
    ? `<div class="grp">${item.repeat(a)}</div><span class="plus">＋</span><div class="grp">${item.repeat(b)}</div>`
    : '';
  $('eq').innerHTML = `${a} ${SYM[kind]} ${b} ＝ <span class="q">？</span>`;
  speak(`${a} ${WORD[kind]} ${b} は？`);

  const set = new Set([ans]);
  const near = (kind === 'add' && lv === 6) ? [ans-10, ans+10, ans-1, ans+1, ans-2, ans+2] : kind === 'mul' ? [a*(b+1), a*(b-1), (a+1)*b, (a-1)*b] : [];
  while(set.size < 3){
    let w = near.length && Math.random() < .8 ? near[rnd(0, near.length - 1)] : ans + rnd(-3, 3);
    if(w >= 0 && w <= max && w !== ans) set.add(w);
    else if(set.size < 3 && Math.random() < .2) set.add(rnd(0, max));
  }
  const box = $('choices'); box.innerHTML = '';
  [...set].sort(() => Math.random() - .5).forEach(v => {
    const el = document.createElement('button');
    el.className = 'btn choice'; el.textContent = v;
    el.onclick = () => answer(el, v, cur.ans);
    box.appendChild(el);
  });
}

function answer(el, v, ans){
  if(locked) return;
  if(v === ans){
    locked = true;
    el.classList.add('ok','pop');
    if(miss === 0) score++;
    const p = PRAISE[rnd(0, PRAISE.length - 1)];
    $('msg').textContent = '🎉 ' + p;
    $('eq').innerHTML = `${cur.a} ${SYM[cur.kind]} ${cur.b} ＝ <span class="q">${ans}</span>`;
    $('stars').textContent = '⭐ ' + score;
    speak(`${ans}！ ${p}`);
    n++;
    setTimeout(next, 1600);
  }else{
    miss++;
    el.classList.add('ng','shake');
    el.disabled = true;
    $('msg').textContent = 'おしい！ もういちど！';
    speak('おしい、もういちど');
  }
}

function finish(){
  $('prog').style.width = '100%';
  show('end');
  const s = '⭐'.repeat(score) || '🌱';
  $('result').innerHTML = `${TOTAL}もん ちゅう ${score}もん いっぱつで せいかい！<br><span style="font-size:2rem">${s}</span>`;
  speak('よくできました！');
}

document.querySelectorAll('.age[data-lv]').forEach(btn => {
  btn.onclick = () => +btn.dataset.lv === 6 ? show('mode') : start(+btn.dataset.lv);
});
document.querySelectorAll('.age[data-op]').forEach(btn => {
  btn.onclick = () => start(6, btn.dataset.op);
});
$('modeBack').onclick = () => show('home');
$('back').onclick = () => { try{speechSynthesis.cancel()}catch(e){} show('home'); };
$('again').onclick = () => lastRun();
$('toHome').onclick = () => show('home');

/* ---------- ひっ算 ---------- */
let hType, hA, hB, hAns, hDig, hCarry, hPos, hMiss, hLocked;
const dg = (x, p) => Math.floor(x / 10 ** p) % 10;

function hStart(t){
  hType = t; n = 0; score = 0; lastRun = () => hStart(t);
  show('hgame'); hNext();
}

function hNext(){
  if(n >= TOTAL) return finish();
  const kind = hType === 'mix' ? (rnd(0, 1) ? '22' : '32') : hType;
  if(kind === '22'){ hA = rnd(10, 99); hB = rnd(10, 99); }
  else { hA = rnd(100, 899); hB = rnd(10, 99); }
  hAns = hA + hB;
  hDig = String(hAns).length;
  hCarry = [0];
  for(let p = 0; p < 3; p++) hCarry[p + 1] = Math.floor((dg(hA, p) + dg(hB, p) + hCarry[p]) / 10);
  hPos = 0; hMiss = 0; hLocked = false;
  $('hprog').style.width = (n / TOTAL * 100) + '%';
  $('hstars').textContent = '⭐ ' + score;
  $('hmsg').textContent = 'いちの くらいから！';

  // 列 i: 0=百 1=十 2=一（左から）
  let h = '<div class="cy"></div>';
  for(let i = 0; i < 3; i++) h += `<div class="cy" id="cy${i}"></div>`;
  h += '<div></div>' + [0,1,2].map(i => `<div>${hA >= 10 ** (2 - i) ? dg(hA, 2 - i) : ''}</div>`).join('');
  h += '<div>＋</div>' + [0,1,2].map(i => `<div>${hB >= 10 ** (2 - i) ? dg(hB, 2 - i) : ''}</div>`).join('');
  h += '<div class="ln"></div><div></div>';
  for(let i = 0; i < 3; i++) h += `<div class="bx ${2 - i >= hDig ? 'off' : ''}" id="bx${i}"></div>`;
  $('hs').innerHTML = h;
  hMark();
  speak(`${hA} たす ${hB}。 いちのくらいから たしてね`);
}

function hMark(){
  for(let i = 0; i < 3; i++) $('bx' + i).classList.toggle('on', 2 - i === hPos && hPos < hDig);
}

function hPress(d){
  if(hLocked) return;
  const box = $('bx' + (2 - hPos));
  if(d === dg(hAns, hPos)){
    box.textContent = d;
    const c = hCarry[hPos + 1];
    if(c && hPos + 1 < hDig){
      $('cy' + (2 - hPos - 1)).textContent = c;
      $('hmsg').textContent = `くりあがり ${c}！`;
    }else $('hmsg').textContent = 'そのちょうし！';
    hPos++;
    if(hPos >= hDig){
      hLocked = true;
      document.querySelectorAll('.bx.on').forEach(e => e.classList.remove('on'));
      if(hMiss === 0) score++;
      const p = PRAISE[rnd(0, PRAISE.length - 1)];
      $('hmsg').textContent = '🎉 ' + p;
      $('hstars').textContent = '⭐ ' + score;
      speak(`${hAns}！ ${p}`);
      n++;
      setTimeout(hNext, 1800);
    }else hMark();
  }else{
    hMiss++;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    $('hmsg').textContent = 'おしい！ もういちど！';
    speak('おしい、もういちど');
  }
}

$('pad').innerHTML = [1,2,3,4,5,6,7,8,9,0].map(d => `<button class="btn" data-d="${d}">${d}</button>`).join('');
$('pad').onclick = e => { const b = e.target.closest('[data-d]'); if(b) hPress(+b.dataset.d); };
$('toH').onclick = () => show('hmode');
$('hmodeBack').onclick = () => show('home');
$('hback').onclick = () => { try{speechSynthesis.cancel()}catch(e){} show('home'); };
document.querySelectorAll('.age[data-h]').forEach(btn => btn.onclick = () => hStart(btn.dataset.h));
</script>
</body>
</html>
