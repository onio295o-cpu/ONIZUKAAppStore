<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さんすうクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* ===== デザイン方針：えほん風（クリーム色の紙・こげ茶の太い線・はっきりした色・大きな文字） ===== */
:root{
  --paper:#fff8e7; --paper2:#ffefc8; --ink:#3b2a1e; --ink2:#6b5444;
  --orange:#ff8a3d; --orange2:#d9601a; --yellow:#ffd23f; --yellow2:#d9a400;
  --green:#3ec46d; --green2:#25934d; --blue:#43a6ff; --blue2:#1f73c4; --red:#ff5a6e; --red2:#c4304a;
  --line:4px solid var(--ink); --r:22px; --pop:0 6px 0 var(--ink);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-weight:800;color:var(--ink);background:var(--paper);overflow:hidden;font-size:20px;line-height:1.35}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.hide{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.wrap{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px 18px;position:relative}

/* 背景（やわらかい空と地面） */
.bg-night{background:linear-gradient(#bfe6ff 0,#e4f5ff 60%,#fff3d6 100%)}
.stars::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:radial-gradient(60px 26px at 15% 14%,#fff 98%,transparent),radial-gradient(44px 20px at 22% 11%,#fff 98%,transparent),
  radial-gradient(70px 28px at 82% 22%,#fff 98%,transparent),radial-gradient(46px 22px at 74% 19%,#fff 98%,transparent)}
.bg-meadow{background:linear-gradient(#a8dcff 0,#dff3ff 55%,#8fd77a 55%,#63bd5a 100%)}
.bg-forest{background:linear-gradient(#b5e8c8 0,#e6f8ea 55%,#6cc06a 55%,#3f9a4c 100%)}
.bg-desert{background:linear-gradient(#ffd3a1 0,#fff0d4 55%,#f5cf86 55%,#e0ac5a 100%)}
.bg-sky{background:linear-gradient(#b3c2ff 0,#e9e4ff 55%,#ffffff 55%,#e6e1ff 100%)}
.bg-cave{background:linear-gradient(#c9b7f0 0,#ede5ff 55%,#9b86c9 55%,#7a66a8 100%)}
.bg-volcano{background:linear-gradient(#ffb3a1 0,#ffe6dc 55%,#c98a6a 55%,#a5674c 100%)}
.bg-ice{background:linear-gradient(#b9dcff 0,#eef7ff 55%,#d7ecff 55%,#aed2f5 100%)}
.bg-castle{background:linear-gradient(#c9c3ee 0,#f0edff 55%,#b8b3c9 55%,#958fa8 100%)}

/* パネル・ボタン（太いこげ茶の線＋ずらした影） */
.panel{background:var(--paper);border:var(--line);border-radius:var(--r);box-shadow:var(--pop)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border-radius:22px;padding:14px 20px;font-size:1.5rem;
  color:var(--ink);background:var(--yellow);border:var(--line);box-shadow:0 7px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:#fff}
.btn.ghost{min-height:52px;background:#fff;padding:6px 14px;font-size:1.05rem;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:16px}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#d8d2c8;color:#9a8f84}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.8rem;background:var(--ink);color:#fff}
.title-logo{font-size:clamp(3rem,14vw,4.4rem);line-height:1.02;text-align:center;margin:0;color:var(--orange);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);letter-spacing:.02em}
.title-logo span{color:var(--yellow)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.hdr h2{margin:0;font-size:clamp(1.05rem,5vw,1.4rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
.hdr .sp{width:86px}
.starline{color:var(--ink);font-size:1.05rem}

/* ===== ホーム ===== */
#home .wrap{justify-content:space-between}
.home-stage{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:200px;padding-bottom:16px;position:relative}
.home-stage::after{content:"";position:absolute;left:8%;right:8%;bottom:6px;height:26px;border-radius:50%;background:rgba(59,42,30,.14)}
.home-stage .hero{width:140px;animation:bob 1.6s ease-in-out infinite;z-index:1}
.home-stage .hero img{width:100%;max-height:220px;object-fit:contain}
.home-stage .enemy{width:120px;animation:bob 1.3s ease-in-out infinite reverse;z-index:1}
@keyframes bob{50%{transform:translateY(-10px)}}
.menu{display:flex;flex-direction:column;gap:18px}
.menu .sub{font-size:1.25rem;white-space:nowrap;padding:12px 8px}
.chip:empty{visibility:hidden}
.menu .main{min-height:92px;font-size:2rem;background:var(--orange);color:#fff;-webkit-text-stroke:0}

/* ===== コース・ステージ ===== */
.list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 4px 16px;align-content:start}
.course{padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .06s}
.course:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.course .ic{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.3rem;border:var(--line)}
.course .nm{font-size:1rem;line-height:1.25;word-break:keep-all}
.path{flex:1;display:flex;flex-direction:column-reverse;justify-content:space-around;align-items:center;padding:16px 0}
.node{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;
  background:var(--yellow);border:var(--line);box-shadow:0 7px 0 var(--ink)}
.node small{font-size:.8rem;letter-spacing:1px;color:var(--ink)}
.node.boss{width:116px;height:116px;background:var(--red);color:#fff}
.node.boss small{color:#fff}
.node.lock{background:#d8d2c8;color:#8a7f74}
.node:nth-child(odd){transform:translateX(-58px)}.node:nth-child(even){transform:translateX(58px)}
.node.now{animation:nodepulse 1s ease-in-out infinite}
@keyframes nodepulse{50%{box-shadow:0 7px 0 var(--ink),0 0 0 10px rgba(255,138,61,.45)}}

/* ===== バトル ===== */
#battle .wrap{gap:14px}
.arena{position:relative;height:33vh;min-height:210px;flex-shrink:0;border-radius:var(--r);overflow:hidden;border:var(--line);box-shadow:var(--pop);background:inherit}
.enemy-box{position:absolute;right:5%;top:6%;width:46%;max-width:200px;text-align:center;z-index:1}
.enemy-box .enemy{width:100%;margin-top:4px;animation:bob 1.4s ease-in-out infinite;transform-origin:50% 100%}
.enemy-box .enemy.hit{animation:hit .45s}
.enemy-box .enemy.attack{animation:eatk .5s}
.enemy-box .enemy.down{animation:down .9s forwards}
@keyframes hit{0%,100%{filter:none;transform:none}20%{filter:brightness(1.8);transform:translateX(14px) scale(1.06,.94)}50%{transform:translateX(-8px)}}
@keyframes eatk{40%{transform:translateX(-40%) scale(1.12)}}
@keyframes down{30%{filter:brightness(1.8);transform:scale(1.2,.8)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.ename{font-size:.85rem;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 10px;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.hpbar{height:18px;border-radius:99px;background:#fff;border:3px solid var(--ink);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--green);transition:width .4s}
.hpbar.low i{background:var(--red)}
.hero-box{position:absolute;left:5%;bottom:5%;width:36%;max-width:150px;z-index:2}
.hero-box img,.hero-box svg{display:block;width:100%;max-height:24vh;object-fit:contain;animation:bob 1.8s ease-in-out infinite}
.hero-box.atk{animation:dash .55s cubic-bezier(.3,.6,.4,1)}
@keyframes dash{0%{transform:none}35%{transform:translateX(110%) translateY(-20%) scale(1.1)}100%{transform:none}}
.hero-box.hurt{animation:hurt .45s}
@keyframes hurt{30%{transform:translateX(-14px) rotate(-6deg)}}
.slash{position:absolute;right:12%;top:22%;width:40%;pointer-events:none;opacity:0;z-index:3}
.slash.on{animation:slash .4s ease-out}
@keyframes slash{0%{opacity:1;transform:scale(.4) rotate(-30deg)}60%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(10deg)}}
.dmg{position:absolute;right:14%;top:18%;font-size:2.4rem;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0;z-index:4;white-space:nowrap}
.dmg.on{animation:dmg .8s ease-out}
@keyframes dmg{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.3)}100%{opacity:0;transform:translateY(-40px)}}
.combo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:1.6rem;color:var(--orange);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;opacity:0;white-space:nowrap;z-index:4}
.combo.on{animation:cpop .8s ease-out forwards}
@keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.4)}40%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.qwin{padding:20px 14px 12px;text-align:center;position:relative}
.qcount{position:absolute;top:-17px;left:16px;font-size:.9rem;background:var(--orange);color:#fff;padding:2px 12px;border-radius:99px;border:3px solid var(--ink)}
.eq{font-size:clamp(2.8rem,14vw,4rem);letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.eq .q{color:var(--orange)}
.pics{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.7rem}
.pics .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:44%}
.hint{min-height:1.5em;font-size:1.1rem;color:var(--blue2);margin-top:6px}
.hint .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px;font-size:1.1rem;letter-spacing:3px;color:var(--ink)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto}
.answers .btn{font-size:clamp(2.4rem,12vw,3.4rem);min-height:104px;padding:0;background:#fff}
.answers .btn:nth-child(1){background:#fff1b8}.answers .btn:nth-child(2){background:#d8f0ff}.answers .btn:nth-child(3){background:#ffe0e6}
.answers .btn.ng{animation:shake .35s}
.answers .btn.ng:disabled{background:#d8d2c8}
.answers .btn.ok{background:var(--green);color:#fff}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hs{display:grid;grid-template-columns:repeat(4,54px);justify-content:center;gap:2px 6px;font-size:2.6rem;font-variant-numeric:tabular-nums}
.hs div{height:54px;display:flex;align-items:center;justify-content:center}
.hs .cy{height:24px;font-size:1.3rem;color:var(--red)}
.hs .ln{height:5px;background:var(--ink);border-radius:3px;grid-column:1/-1}
.hs .bx{border:3px dashed var(--ink2);border-radius:12px;color:var(--green2);background:#fff}
.hs .bx.on{border:4px solid var(--orange);background:#fff1b8}
.hs .bx.off{border:none;background:none}
.hs .bx.ng{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:auto}
.pad .btn{font-size:2.2rem;min-height:76px;padding:0;background:#fff}

/* ===== リザルト ===== */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(59,42,30,.55)}
.result{width:min(92vw,430px);padding:24px 18px 20px;text-align:center;position:relative;z-index:2}
.result h2{margin:0 0 4px;font-size:2.2rem;color:var(--orange);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.bigstars{font-size:3.4rem;letter-spacing:6px;margin:4px 0}
.bigstars span{display:inline-block;opacity:.25;filter:grayscale(1)}
.bigstars span.on{opacity:1;filter:none;animation:starin .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.party{display:flex;justify-content:center;gap:6px;height:120px;margin:6px 0}
.party img,.party svg{height:100%;max-width:33%;object-fit:contain;animation:dance .6s ease-in-out infinite alternate}
.party img:nth-child(2){animation-delay:-.2s}.party img:nth-child(3){animation-delay:-.4s}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-12px)}}
.result .row{display:flex;gap:12px;margin-top:16px}.result .row .btn{flex:1}
#fw{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;display:none}

/* ===== なかま・せってい ===== */
.chars{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 4px;align-content:start}
.chars .c{padding:8px 6px;text-align:center;font-size:.8rem;line-height:1.2}
.chars img{width:100%;height:92px;object-fit:contain}
.setting{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:1.3rem;margin-top:16px}
.toggle{width:76px;height:44px;border-radius:99px;background:#d8d2c8;border:var(--line);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:left .2s}
.toggle.on{background:var(--green)}.toggle.on::after{left:35px}
.note{font-size:.95rem;font-weight:500;color:var(--ink2);line-height:1.5;text-align:center}
a.btn{text-decoration:none}
</style>
</head>
<body>

<section id="home" class="screen bg-night stars">
  <div class="wrap">
    <div style="text-align:center;margin-top:4vh">
      <h1 class="title-logo">さんすう<br><span>クエスト</span></h1>
      <div class="starline" id="totalStars" style="margin-top:10px"></div>
    </div>
    <div class="home-stage"><div class="hero" data-hero></div><div class="enemy" data-enemy="200"></div></div>
    <div class="menu">
      <button class="btn main" data-go="courses">▶ ぼうけんに でる</button>
      <div style="display:flex;gap:12px">
        <button class="btn sub" data-go="party" style="flex:1">🤝 なかま</button>
        <button class="btn sub" data-go="settings" style="flex:1">⚙️ せってい</button>
      </div>
    </div>
  </div>
</section>

<section id="courses" class="screen bg-night stars hide">
  <div class="wrap">
    <div class="hdr"><button class="btn ghost" data-go="home">← もどる</button><h2>どこへ いく？</h2><span class="sp"></span></div>
    <div class="list" id="courseList"></div>
  </div>
</section>

<section id="stages" class="screen hide">
  <div class="wrap">
    <div class="hdr"><button class="btn ghost" data-go="courses">← もどる</button><h2 id="stageTitle"></h2><span class="sp"></span></div>
    <div class="path" id="stagePath"></div>
  </div>
</section>

<section id="battle" class="screen bg-night hide">
  <div class="wrap">
    <div class="hdr"><button class="btn ghost" id="flee">🏃 にげる</button><h2 id="bTitle"></h2><span class="sp chip" id="bCombo" style="text-align:center"></span></div>
    <div class="arena" id="arena">
      <div class="enemy-box">
        <div class="ename" id="eName"></div>
        <div class="hpbar" id="hpbar"><i id="hpfill"></i></div>
        <div class="enemy" id="enemy"></div>
      </div>
      <div class="hero-box" id="heroBox"></div>
      <svg class="slash" id="slash" viewBox="0 0 100 100"><path d="M10 80 Q50 50 92 12" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M18 88 Q55 58 96 26" stroke="#ffe46b" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      <div class="dmg" id="dmg"></div>
      <div class="combo" id="comboFx"></div>
    </div>
    <div class="panel qwin">
      <span class="qcount" id="qcount"></span>
      <div class="pics" id="pics"></div>
      <div class="eq" id="eq"></div>
      <div class="hs hide" id="hs"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="pad hide" id="pad"></div>
  </div>
</section>

<section id="party" class="screen bg-night stars hide">
  <div class="wrap">
    <div class="hdr"><button class="btn ghost" data-go="home">← もどる</button><h2>なかま</h2><span class="sp"></span></div>
    <div class="chars" id="charList"></div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
      <label class="btn">📁 画像を よみこむ<input type="file" id="charFiles" accept="image/*" multiple hidden></label>
      <a class="btn sub" href="cutout.html">✂️ 画像を きりぬく</a>
      <p class="note">よみこんだ 画像は この端末に ほぞんされ、バトルで いっしょに たたかいます。</p>
    </div>
  </div>
</section>

<section id="settings" class="screen bg-night stars hide">
  <div class="wrap">
    <div class="hdr"><button class="btn ghost" data-go="home">← もどる</button><h2>せってい</h2><span class="sp"></span></div>
    <div class="panel setting">🔊 こうかおん<button class="toggle" data-set="sound"></button></div>
    <div class="panel setting">🗣 よみあげ<button class="toggle" data-set="voice"></button></div>
    <button class="btn ghost" id="resetSave" style="margin-top:20px">⭐ きろくを けす</button>
  </div>
</section>

<div id="overlay" class="overlay hide"><div class="panel result" id="resultBox"></div></div>
<canvas id="fw"></canvas>

<script>
/* ================================================================
   1) ロジック（画面から独立）：問題生成・選択肢・ヒント・星
   ================================================================ */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const SYM = {add:'＋', mul:'×', div:'÷'}, WORD = {add:'たす', mul:'かける', div:'わる'};

const Logic = {
  gen(type){
    if(type === 'mix') type = pick(['add200', 'mul', 'div']);
    let a, b;
    switch(type){
      case 'add4':   do{ a = rnd(1, 5); b = rnd(1, 5); }while(a + b > 5);  return {op:'add', a, b, ans:a + b, max:5, pics:true};
      case 'add5':   do{ a = rnd(1, 9); b = rnd(1, 9); }while(a + b > 10); return {op:'add', a, b, ans:a + b, max:10, pics:true};
      case 'add200': do{ a = rnd(11, 150); b = rnd(11, 100); }while(a + b > 200);
                     return {op:'add', a, b, ans:a + b, max:200, near:[-10, 10, -1, 1, -2, 2]};
      case 'mul':    a = rnd(1, 9); b = rnd(1, 9);
                     return {op:'mul', a, b, ans:a * b, max:81, nearAbs:[a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b]};
      case 'div':  { b = rnd(2, 9); const q = rnd(1, 9); return {op:'div', a:b * q, b, ans:q, max:9}; }
      case 'h22':    a = rnd(10, 99); b = rnd(10, 99); return {op:'add', a, b, ans:a + b, hissan:true};
      case 'h32':    a = rnd(100, 899); b = rnd(10, 99); return {op:'add', a, b, ans:a + b, hissan:true};
    }
  },
  choices(p){
    const set = new Set([p.ans]), ok = w => Number.isInteger(w) && w >= 0 && w <= p.max && w !== p.ans;
    const cand = [...(p.nearAbs || []), ...(p.near || []).map(d => p.ans + d)].filter(ok);
    for(let g = 0; set.size < 3 && g < 200; g++){
      const w = cand.length && Math.random() < .75 ? pick(cand) : p.ans + rnd(-3, 3);
      if(ok(w)) set.add(w);
    }
    for(let w = 0; set.size < 3; w++) if(ok(w)) set.add(w);
    return shuffle([...set]);
  },
  hint(p){
    if(p.op === 'add' && p.pics) return {text:'ひとつずつ かぞえて みよう！', dots:[p.a, p.b]};
    if(p.op === 'add'){ const t = p.b - p.b % 10, o = p.b % 10;
      return {text:o && t ? `${p.a} ＋ ${t} ＝ ${p.a + t}、そこに ${o} を たそう` : '10の まとまりで かんがえよう'}; }
    if(p.op === 'mul') return p.a * p.b <= 30 ? {text:`${p.a}こ が ${p.b}れつ`, grid:[p.a, p.b]} : {text:`${p.a} × ${p.b - 1} ＝ ${p.a * (p.b - 1)}、そこに ${p.a} を たそう`};
    if(p.op === 'div') return {text:`${p.b} × □ ＝ ${p.a}　□ は いくつ？`};
  },
  digit:(x, p) => Math.floor(x / 10 ** p) % 10,
  carries(a, b){ const c = [0]; for(let p = 0; p < 3; p++) c[p + 1] = Math.floor((Logic.digit(a, p) + Logic.digit(b, p) + c[p]) / 10); return c; },
  stars:misses => misses === 0 ? 3 : misses <= 2 ? 2 : 1,
};

let AC;
function sfx(kind){
  if(!save.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type = 'sine', v = .22, t0 = 0, f2) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + t0);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + t0 + d);
      g.gain.setValueAtTime(v, t + t0); g.gain.exponentialRampToValueAtTime(.001, t + t0 + d);
      o.connect(g).connect(AC.destination); o.start(t + t0); o.stop(t + t0 + d + .02);
    };
    const noise = (d, fq, v = .4, t0 = 0, type = 'bandpass') => {
      const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), c = buf.getChannelData(0);
      for(let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = buf; f.type = type; f.frequency.value = fq; g.gain.value = v;
      s.connect(f).connect(g).connect(AC.destination); s.start(t + t0);
    };
    ({
      tap:  () => tone(660, .06, 'triangle', .12),
      slash:() => { noise(.18, 3000, .5, 0, 'highpass'); tone(900, .12, 'sawtooth', .08, 0, 300); },
      hit:  () => { tone(180, .2, 'square', .18, 0, 60); noise(.12, 600, .5); },
      crit: () => { tone(1200, .1, 'square', .12); tone(1600, .2, 'square', .12, .08); },
      miss: () => tone(240, .3, 'triangle', .2, 0, 120),
      hurt: () => { noise(.15, 300, .5); tone(120, .2, 'sawtooth', .15, 0, 70); },
      down: () => { tone(500, .5, 'sawtooth', .15, 0, 60); noise(.5, 500, .4); },
      win:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'triangle', .18, i * .11)),
      star: () => tone(1400, .15, 'sine', .16, 0, 2000),
      boom: () => { tone(110, .5, 'sawtooth', .25, 0, 30); noise(.5, 350, .5); },
    })[kind]?.();
  }catch(e){}
}
function speak(t){
  if(!save.voice) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = .95; u.pitch = 1.3; speechSynthesis.speak(u); }catch(e){}
}

const CharDB = {
  open(){ return this.p = this.p || new Promise(res => {
    try{ const r = indexedDB.open('tashizan-chars', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('chars', {keyPath:'name'});
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    }catch(e){ res(null); } }); },
  async all(){ const d = await this.open(); if(!d) return [];
    return new Promise(res => { try{ const q = d.transaction('chars').objectStore('chars').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }catch(e){ res([]); } }); },
  async put(rec){ const d = await this.open(); if(!d) return;
    return new Promise(res => { try{ const t = d.transaction('chars', 'readwrite'); t.objectStore('chars').put(rec); t.oncomplete = t.onerror = res; }catch(e){ res(); } }); },
};

/* ================================================================
   6) バトル：正解＝こうげき、まちがい＝ヒント、HP0でクリア
   ================================================================ */
let B = null;
const later = (fn, ms) => { const id = B && B.id; setTimeout(() => { if(B && B.id === id) fn(); }, ms); };   // にげたら 予約を 止める
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
function startBattle(c, s){
  const boss = s === STAGES;
  B = {id:Math.random(), c, s, boss, total:boss ? Q_BOSS : Q_NORMAL, misses:0, combo:0, maxCombo:0, done:0};
  B.hp = B.total;
  $('battle').className = 'screen ' + c.bg;
  $('bTitle').textContent = boss ? '👑 ボス バトル' : `ステージ ${s}`;
  $('eName').textContent = boss ? `${c.enemy}の キング` : `${c.enemy}の ${pick(ENEMY_NAMES)}`;
  const en = $('enemy'); en.className = 'enemy'; en.innerHTML = enemySVG(c.hue + (s - 1) * 14, boss);
  $('heroBox').className = 'hero-box'; $('heroBox').innerHTML = heroHTML();
  $('answers').innerHTML = ''; $('eq').innerHTML = ''; $('pics').innerHTML = ''; $('hint').textContent = '';
  updateHp(); updateCombo();
  show('battle');
  speak(boss ? 'ボスが あらわれた！' : 'モンスターが あらわれた！');
  later(nextQuestion, 800);
}
$('flee').onclick = () => { B = null; try{ speechSynthesis.cancel(); }catch(e){} sfx('tap'); openCourse(course); };
function updateHp(){
  const r = B.hp / B.total; $('hpfill').style.width = (r * 100) + '%';
  $('hpbar').classList.toggle('low', r <= .34);
  $('qcount').textContent = `もんだい ${Math.min(B.done + 1, B.total)} / ${B.total}`;
}
function updateCombo(){ $('bCombo').textContent = B.combo >= 2 ? `🔥${B.combo}` : ''; }

function nextQuestion(){
  const p = B.p = Logic.gen(B.c.type);
  B.first = true; B.locked = false;
  $('hint').innerHTML = '';
  updateHp();
  const item = pick(['🍎', '🍓', '🍩', '⭐', '🐟', '🍪', '🌸', '🎈']);
  $('pics').innerHTML = p.pics ? `<div class="grp">${item.repeat(p.a)}</div><span>＋</span><div class="grp">${item.repeat(p.b)}</div>` : '';
  const hs = !!p.hissan;
  $('eq').classList.toggle('hide', hs); $('hs').classList.toggle('hide', !hs);
  $('answers').classList.toggle('hide', hs); $('pad').classList.toggle('hide', !hs);
  if(hs){ renderHissan(); speak(`${p.a} たす ${p.b}。 いちの くらいから`); return; }
  $('eq').innerHTML = `${p.a} ${SYM[p.op]} ${p.b} ＝ <span class="q">？</span>`;
  const box = $('answers'); box.innerHTML = '';
  Logic.choices(p).forEach(v => {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = v;
    b.onclick = () => answer(b, v);
    box.append(b);
  });
  speak(`${p.a} ${WORD[p.op]} ${p.b} は？`);
}
function answer(btn, v){
  if(!B || B.locked || btn.disabled) return;
  if(v === B.p.ans){
    B.locked = true; btn.classList.add('ok');
    $('eq').innerHTML = `${B.p.a} ${SYM[B.p.op]} ${B.p.b} ＝ <span class="q">${B.p.ans}</span>`;
    attack();
  }else{ btn.disabled = true; btn.classList.add('ng'); wrong(); }
}
function wrong(){
  B.misses++; B.first = false; B.combo = 0; updateCombo();
  sfx('miss'); later(() => sfx('hurt'), 150);
  replay($('enemy'), 'attack'); replay($('heroBox'), 'hurt');
  const h = Logic.hint(B.p);
  if(h){
    let html = `💡 ${h.text}`;
    if(h.dots) html += `<div class="dots">${'●'.repeat(h.dots[0])}　<span style="color:var(--gold)">${'●'.repeat(h.dots[1])}</span></div>`;
    if(h.grid) html += `<div class="dots" style="flex-direction:column;align-items:center">${Array.from({length:h.grid[1]}, () => `<div>${'●'.repeat(h.grid[0])}</div>`).join('')}</div>`;
    $('hint').innerHTML = html;
  }
  speak('おしい！ ヒントを みてね');
}
function attack(){
  if(B.first){ B.combo++; B.maxCombo = Math.max(B.maxCombo, B.combo); }
  updateCombo();
  const crit = B.first && B.combo >= 3;
  replay($('heroBox'), 'atk'); sfx('slash');
  later(() => {
    replay($('slash'), 'on'); replay($('enemy'), 'hit');
    const dm = $('dmg'); dm.textContent = crit ? 'クリティカル！' : pick(['ズバッ！', 'ドカッ！', 'バシッ！']);
    dm.style.fontSize = crit ? '1.7rem' : ''; replay(dm, 'on');
    if(crit){ const cf = $('comboFx'); cf.textContent = `🔥 ${B.combo} コンボ！`; replay(cf, 'on'); sfx('crit'); }
    sfx('hit');
    B.hp--; B.done++; updateHp();
    speak(pick(['せいかい！', 'すごい！', 'やったね！', 'その ちょうし！']));
  }, 250);
  later(() => { $('comboFx').classList.remove('on'); B.hp <= 0 ? defeat() : nextQuestion(); }, 1250);
}

/* ---- ひっ算（一のくらいから1けたずつ） ---- */
function renderHissan(){
  const p = B.p, D = String(p.ans).length;
  p.dig = D; p.pos = 0; p.car = Logic.carries(p.a, p.b);
  const d = (x, i) => x >= 10 ** (2 - i) ? Logic.digit(x, 2 - i) : '';
  let h = '<div class="cy"></div>' + [0, 1, 2].map(i => `<div class="cy" id="cy${i}"></div>`).join('');
  h += '<div></div>' + [0, 1, 2].map(i => `<div>${d(p.a, i)}</div>`).join('');
  h += '<div>＋</div>' + [0, 1, 2].map(i => `<div>${d(p.b, i)}</div>`).join('');
  h += '<div class="ln"></div><div></div>' + [0, 1, 2].map(i => `<div class="bx ${2 - i >= D ? 'off' : ''}" id="bx${i}"></div>`).join('');
  $('hs').innerHTML = h; markBox();
  $('hint').textContent = 'いちの くらいから たそう！';
}
function markBox(){ for(let i = 0; i < 3; i++) $('bx' + i).classList.toggle('on', 2 - i === B.p.pos && B.p.pos < B.p.dig); }
$('pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button class="btn" data-d="${d}">${d}</button>`).join('');
$('pad').onclick = e => {
  const b = e.target.closest('[data-d]'); if(!b || !B || B.locked || !B.p || !B.p.hissan) return;
  const p = B.p, d = +b.dataset.d, box = $('bx' + (2 - p.pos));
  if(d === Logic.digit(p.ans, p.pos)){
    sfx('tap'); box.textContent = d;
    const c = p.car[p.pos + 1];
    $('hint').textContent = c && p.pos + 1 < p.dig ? `くりあがり ${c}！` : 'その ちょうし！';
    if(c && p.pos + 1 < p.dig) $('cy' + (1 - p.pos)).textContent = c;
    p.pos++;
    markBox();
    if(p.pos >= p.dig){ B.locked = true; attack(); }
  }else{
    replay(box, 'ng'); wrong();
    const da = Logic.digit(p.a, p.pos), db = Logic.digit(p.b, p.pos), c = p.car[p.pos];
    $('hint').textContent = `💡 ${da} ＋ ${db}${c ? ' ＋ ' + c : ''} の いちばん みぎの かず`;
  }
};

/* ---- たおした → リザルト ---- */
function defeat(){
  B.locked = true; replay($('enemy'), 'down'); sfx('down');
  later(result, 950);
}
function result(){
  const st = Logic.stars(B.misses), key = B.c.id + '-' + B.s;
  save.stars[key] = Math.max(st, save.stars[key] || 0); Save.store();
  const c = B.c, s = B.s, boss = B.boss, hasNext = s < STAGES;
  const party = shuffle(PARTY).slice(0, 3).map(m => `<img src="${m.src}" alt="">`).join('') || heroSVG();
  $('resultBox').innerHTML = `<h2>${boss ? 'ボス げきは！' : 'ステージ クリア！'}</h2>
    <div class="bigstars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="party">${party}</div>
    <div>${B.misses === 0 ? 'ノーミス！ パーフェクト！' : `まちがい ${B.misses}かい`}${B.maxCombo >= 3 ? `<br>🔥 さいだい ${B.maxCombo} コンボ` : ''}</div>
    <div class="row">${hasNext ? '<button class="btn" id="rNext">つぎへ ▶</button>' : ''}<button class="btn sub" id="rMap">マップ</button></div>`;
  $('overlay').classList.remove('hide');
  sfx('win'); speak(boss ? 'ボスを たおした！ すごい！' : 'ステージ クリア！');
  [...$('resultBox').querySelectorAll('.bigstars span')].forEach((el, i) => { if(i < st) setTimeout(() => { el.classList.add('on'); sfx('star'); }, 400 + i * 350); });
  if(st === 3 || boss) fireworks(boss ? 30000 : 4000);
  B = null;
  const close = () => { stopFireworks(); $('overlay').classList.add('hide'); };
  if(hasNext) $('rNext').onclick = () => { close(); startBattle(c, s + 1); };
  $('rMap').onclick = () => { close(); openCourse(c); };
}

/* ---- 花火（ボスは30秒） ---- */
let fwRun = 0;
function fireworks(ms){
  const run = ++fwRun, cv = $('fw'), x = cv.getContext('2d'), until = performance.now() + ms;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = 'block'; x.clearRect(0, 0, cv.width, cv.height);
  const parts = []; let last = 0, n = 0;
  const burst = () => {
    const cx = cv.width * (.1 + Math.random() * .8), cy = cv.height * (.08 + Math.random() * .35), hue = rnd(0, 360), k = rnd(50, 90);
    for(let i = 0; i < k; i++){ const a = Math.PI * 2 * i / k, v = 2 + Math.random() * 4.5;
      parts.push({x:cx, y:cy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:60 + rnd(0, 40), hue:hue + rnd(-20, 20)}); }
    if(n++ % 3 === 0) sfx('boom');
  };
  const tick = ts => {
    if(run !== fwRun) return;
    if(ts < until && ts - last > 420){ last = ts; burst(); }
    x.globalCompositeOperation = 'destination-out'; x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(0, 0, cv.width, cv.height);
    x.globalCompositeOperation = 'lighter';
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.vy *= .985;
      if(--p.life <= 0){ parts.splice(i, 1); continue; }
      x.fillStyle = `hsla(${p.hue},100%,${55 + p.life / 4}%,${Math.min(1, p.life / 40)})`;
      x.beginPath(); x.arc(p.x, p.y, 2.6, 0, 7); x.fill();
    }
    if(ts < until || parts.length) requestAnimationFrame(tick); else cv.style.display = 'none';
  };
  requestAnimationFrame(tick);
}
function stopFireworks(){ fwRun++; $('fw').style.display = 'none'; }

show('home');
</script>
