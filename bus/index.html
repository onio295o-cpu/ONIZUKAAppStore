    color: #fff;
    border: none;
    position: relative;
    overflow: hidden;
    margin-top: 16px;
  }
  .next-card::after {
    content: "";
    position: absolute;
    right: -30px;
    bottom: -30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .next-label {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .next-time {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .next-sub {
    font-size: 13px;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  .day-type {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .time-card { padding-bottom: 14px; }
  .time-grid-scroll {
    max-width: 284px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    margin: 0 -4px;
    padding: 4px 4px;
  }
  .time-grid {
    display: flex;
    gap: 8px;
  }
  .time-cell {
    flex: 0 0 auto;
    min-width: 58px;
    padding: 9px 10px;
    text-align: center;
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    background: var(--bg);
    color: var(--text);
  }
  .time-cell.past {
    color: var(--past);
  }
  .time-cell.next {
    background: var(--dep);
    color: #fff;
    font-weight: 700;
  }
  #map {
    height: 260px;
    border-radius: 14px;
    overflow: hidden;
  }
  .stop-label {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: none;
  }
  .stop-label::before { display: none; }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .footer-note {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 8px;
  }

  /* settings overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 22, 8, 0.45);
    display: flex;
    align-items: flex-end;
    z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    background: var(--card);
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .sheet-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
  }
  .sheet-close {
    color: var(--dep);
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .add-row {
    margin-bottom: 18px;
  }
  .add-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .add-select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  .sheet-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="sticky-header">
  <div class="app-header">
    <div class="bus-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="4" width="18" height="12" rx="3" fill="#fff"/>
        <rect x="5.5" y="6.3" width="5" height="3.4" rx="0.8" fill="currentColor" style="color: var(--dep)"/>
        <rect x="13.5" y="6.3" width="5" height="3.4" rx="0.8" fill="currentColor" style="color: var(--dep)"/>
        <circle cx="7.5" cy="18.5" r="1.6" fill="#fff"/>
        <circle cx="16.5" cy="18.5" r="1.6" fill="#fff"/>
      </svg>
    </div>
    <h1>名駅18 バス時刻表</h1>
  </div>
  <div class="subtitle" id="subtitle">読み込み中…</div>

  <div class="section-label">
    <span>出発地</span>
    <span class="edit-link" id="editStopsBtn">＋ バス停を編集</span>
  </div>
  <div class="tabs-row" id="departureSelect"></div>

  <div class="section-label dest"><span>目的地</span></div>
  <div class="tabs-row no-margin" id="destinationSelect"></div>
</div>

<div class="card next-card">
  <div class="next-label" id="nextLabel">次のバス</div>
  <div class="next-time" id="nextTime">--:--</div>
  <div class="next-sub" id="nextSub"></div>
</div>

<div class="card time-card">
  <div class="day-type" id="dayType"></div>
  <div class="time-grid-scroll" id="timeGridScroll">
    <div class="time-grid" id="timeGrid"></div>
  </div>
</div>

<div class="card">
  <div class="card-title">バス停の場所・ルート</div>
  <div id="map"></div>
</div>

<div class="footer-note">出典: 名古屋市交通局 市バスGTFS-JPデータ</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">バス停を追加</div>
      <div class="sheet-close" id="closeSheet">閉じる</div>
    </div>
    <div class="add-row">
      <label class="add-label">出発地の候補に追加</label>
      <input id="addDeparture" class="add-select" type="text" list="departureOptions" placeholder="バス停名を入力…" autocomplete="off">
      <datalist id="departureOptions"></datalist>
    </div>
    <div class="add-row">
      <label class="add-label">目的地の候補に追加</label>
      <input id="addDestination" class="add-select" type="text" list="destinationOptions" placeholder="バス停名を入力…" autocomplete="off">
      <datalist id="destinationOptions"></datalist>
    </div>
    <div class="sheet-hint">停留所名を入力するか一覧から選ぶと追加されます。削除は各タブの「×」からできます。</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let DATA = null;
let selectedDeparture = null;
let selectedDestination = null;
let departureStops = []; // candidate stop names for 出発地 tabs
let destinationStops = []; // candidate stop names for 目的地 tabs
let map = null;
let markers = [];
let routeLines = [];

const ALL_STOP_NAMES = [];
const DIRECTIONS_BY_STOP = {};
const DEFAULT_STOPS = ["大池町", "水主町"];

const rootStyles = getComputedStyle(document.documentElement);
const THEME = {
  dep: rootStyles.getPropertyValue("--dep").trim(),
  dest: rootStyles.getPropertyValue("--dest").trim(),
};

function dayTypeForDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const key = `${y}${m}${day}`;
  if (DATA.holiday_dates.includes(key)) return "日休";
  const dow = d.getDay();
  if (dow === 0) return "日休";
  if (dow === 6) return "土曜";
  return "平日";
}

function minutesNow(d) { return d.getHours() * 60 + d.getMinutes(); }
function toMinutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }

function saveStops(key, list) {
  localStorage.setItem(key, JSON.stringify(list));
}

function loadStops(key) {
  try {
    const raw = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(raw) && raw.length) return raw.filter(n => ALL_STOP_NAMES.includes(n));
  } catch (e) {}
  return DEFAULT_STOPS.slice();
}

// finds a direction/sequence where `dep` appears before `dest`, and returns
// the departure stop_id to read the timetable from.
function resolveTrip(dep, dest) {
  for (const [dirLabel, seq] of Object.entries(DATA.sequences)) {
    const depIdx = seq.findIndex(sid => DATA.stops[sid] && DATA.stops[sid].name === dep);
    const destIdx = seq.findIndex(sid => DATA.stops[sid] && DATA.stops[sid].name === dest);
    if (depIdx !== -1 && destIdx !== -1 && depIdx < destIdx) {
      return { dirLabel, seq, depIdx, destIdx, depStopId: seq[depIdx], destStopId: seq[destIdx] };
    }
  }
  return null;
}

function removeDeparture(name) {
  if (departureStops.length <= 1) return;
  departureStops = departureStops.filter(n => n !== name);
  saveStops("busapp_departures", departureStops);
  if (selectedDeparture === name) selectedDeparture = departureStops[0];
  buildAll();
  render();
}

function removeDestination(name) {
  if (destinationStops.length <= 1) return;
  destinationStops = destinationStops.filter(n => n !== name);
  saveStops("busapp_destinations", destinationStops);
  if (selectedDestination === name) {
    selectedDestination = destinationStops.find(n => n !== selectedDeparture) || null;
  }
  buildAll();
  render();
}

function renderMap() {
  if (!map) {
    map = L.map("map", { zoomControl: false, attributionControl: true });
  }
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];

  const trip = selectedDestination ? resolveTrip(selectedDeparture, selectedDestination) : null;
  const bounds = [];

  if (trip) {
    const latlngs = trip.seq.slice(trip.depIdx, trip.destIdx + 1)
      .map(sid => DATA.stops[sid])
      .filter(Boolean)
      .map(info => [info.lat, info.lon]);
    const line = L.polyline(latlngs, { color: THEME.dest, weight: 4, opacity: 0.85 }).addTo(map);
    routeLines.push(line);

    const depInfo = DATA.stops[trip.depStopId];
    const destInfo = DATA.stops[trip.destStopId];

    const depMarker = L.circleMarker([depInfo.lat, depInfo.lon], {
      radius: 11, color: "#ffffff", weight: 2, fillColor: THEME.dep, fillOpacity: 1,
    }).addTo(map);
    depMarker.bindTooltip(`出発: ${selectedDeparture}`, { permanent: true, direction: "top", offset: [0, -6], className: "stop-label" });
    markers.push(depMarker);
    bounds.push([depInfo.lat, depInfo.lon]);

    const destMarker = L.circleMarker([destInfo.lat, destInfo.lon], {
      radius: 11, color: "#ffffff", weight: 2, fillColor: THEME.dest, fillOpacity: 1,
    }).addTo(map);
    destMarker.bindTooltip(`到着: ${selectedDestination}`, { permanent: true, direction: "top", offset: [0, -6], className: "stop-label" });
    markers.push(destMarker);
    bounds.push([destInfo.lat, destInfo.lon]);
  } else if (selectedDeparture) {
    const dirs = DIRECTIONS_BY_STOP[selectedDeparture];
    const id = findStopId(selectedDeparture, dirs[0]);
    const info = DATA.stops[id];
    if (info) {
      const marker = L.circleMarker([info.lat, info.lon], {
        radius: 11, color: "#ffffff", weight: 2, fillColor: THEME.dep, fillOpacity: 1,
      }).addTo(map);
      marker.bindTooltip(`出発: ${selectedDeparture}`, { permanent: true, direction: "top", offset: [0, -6], className: "stop-label" });
      markers.push(marker);
      bounds.push([info.lat, info.lon]);
    }
  }

  if (bounds.length) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  } else {
    map.setView([35.157, 136.905], 14);
  }

  const tileUrl = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}";
  if (!map._tileLayerAdded) {
    L.tileLayer(tileUrl, {
      attribution: "&copy; Esri &copy; OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(map);
    map._tileLayerAdded = true;
  }
}

function findStopId(stopName, direction) {
  for (const [id, info] of Object.entries(DATA.stops)) {
    if (info.name === stopName && info.direction === direction) return id;
  }
  return null;
}

function render() {
  const now = new Date();
  const dType = dayTypeForDate(now);
  const nowMin = minutesNow(now);

  document.getElementById("subtitle").textContent =
    `${DATA.route}系統 ／ ${now.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric", weekday: "short" })}`;
  document.getElementById("dayType").textContent = `本日のダイヤ: ${dType}`;

  const nextLabel = document.getElementById("nextLabel");
  const nextTimeEl = document.getElementById("nextTime");
  const nextSubEl = document.getElementById("nextSub");
  const grid = document.getElementById("timeGrid");

  if (!selectedDestination) {
    nextLabel.textContent = "目的地を選んでください";
    nextTimeEl.textContent = "--:--";
    nextSubEl.textContent = "マイバス停をもう1件追加すると時刻表が表示されます";
    grid.innerHTML = "";
    renderMap();
    return;
  }

  const trip = resolveTrip(selectedDeparture, selectedDestination);
  if (!trip) {
    nextLabel.textContent = "この組み合わせは運行していません";
    nextTimeEl.textContent = "--:--";
    nextSubEl.textContent = "出発地と目的地の順序が路線と逆かもしれません";
    grid.innerHTML = "";
    renderMap();
    return;
  }

  const info = DATA.stops[trip.depStopId];
  const times = info.times[dType];
  let nextIdx = times.findIndex(t => toMinutes(t) >= nowMin);

  if (nextIdx === -1) {
    nextLabel.textContent = `次のバス（${selectedDeparture} → ${selectedDestination}）`;
    nextTimeEl.textContent = "--:--";
    nextSubEl.textContent = "本日の運行は終了しました" + (times.length ? `（始発 ${times[0]}）` : "");
  } else {
    const t = times[nextIdx];
    const diff = toMinutes(t) - nowMin;
    nextLabel.textContent = `次のバス（${selectedDeparture} → ${selectedDestination}）`;
    nextTimeEl.textContent = t;
    nextSubEl.textContent = diff <= 0 ? "まもなく発車" : `あと ${diff} 分`;
    if (times[nextIdx + 1]) nextSubEl.textContent += ` ／ 次々便 ${times[nextIdx + 1]}`;
  }

  grid.innerHTML = "";
  const cells = [];
  times.forEach((t, i) => {
    const cell = document.createElement("div");
    cell.className = "time-cell";
    if (toMinutes(t) < nowMin) cell.classList.add("past");
    if (i === nextIdx) cell.classList.add("next");
    cell.textContent = t;
    grid.appendChild(cell);
    cells.push(cell);
  });
  // horizontally scroll so 1 previous departure + the next few are in view
  const scrollBox = document.getElementById("timeGridScroll");
  const anchorCell = nextIdx > 0 ? cells[nextIdx - 1] : cells[0];
  if (anchorCell) {
    const cellLeft = anchorCell.getBoundingClientRect().left - scrollBox.getBoundingClientRect().left + scrollBox.scrollLeft;
    scrollBox.scrollLeft = Math.max(0, cellLeft - 4);
  } else {
    scrollBox.scrollLeft = 0;
  }

  renderMap();
}

function makeTab(name, isActive, activeClass, onSelect, onRemove) {
  const btn = document.createElement("div");
  btn.className = "tab-btn" + (isActive ? " " + activeClass : "");
  const label = document.createElement("span");
  label.textContent = name;
  btn.appendChild(label);
  if (onRemove) {
    const x = document.createElement("span");
    x.className = "tab-x";
    x.textContent = "×";
    x.onclick = (e) => {
      e.stopPropagation();
      onRemove(name);
    };
    btn.appendChild(x);
  }
  btn.onclick = onSelect;
  return btn;
}

function buildDepartureTabs() {
  const row = document.getElementById("departureSelect");
  row.innerHTML = "";
  departureStops.forEach(name => {
    const btn = makeTab(name, name === selectedDeparture, "active", () => {
      selectedDeparture = name;
      if (selectedDestination === name) {
        selectedDestination = destinationStops.find(n => n !== name) || null;
      }
      buildAll();
      render();
    }, departureStops.length > 1 ? removeDeparture : null);
    row.appendChild(btn);
  });
}

function buildDestinationTabs() {
  const row = document.getElementById("destinationSelect");
  row.innerHTML = "";
  const options = destinationStops.filter(n => n !== selectedDeparture);
  if (!options.length) {
    const msg = document.createElement("div");
    msg.className = "no-stops-msg";
    msg.textContent = "＋ バス停を編集からもう1件追加してください";
    row.appendChild(msg);
    return;
  }
  options.forEach(name => {
    const btn = makeTab(name, name === selectedDestination, "dest-active", () => {
      selectedDestination = name;
      buildDestinationTabs();
      render();
    }, destinationStops.length > 1 ? removeDestination : null);
    row.appendChild(btn);
  });
}

function buildAll() {
  buildDepartureTabs();
  buildDestinationTabs();
}

function fillAddDropdown(inputEl, datalistId, currentList, onAdd) {
  const options = ALL_STOP_NAMES.filter(n => !currentList.includes(n));
  const datalist = document.getElementById(datalistId);
  datalist.innerHTML = "";
  options.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    datalist.appendChild(opt);
  });
  inputEl.value = "";
  inputEl.placeholder = options.length ? "バス停名を入力…" : "追加できる停留所はありません";
  inputEl.disabled = !options.length;

  const tryAdd = () => {
    const val = inputEl.value.trim();
    if (options.includes(val)) {
      inputEl.value = "";
      onAdd(val);
    }
  };
  inputEl.oninput = tryAdd; // fires immediately when picked from the datalist suggestion list
  inputEl.onchange = tryAdd;
  inputEl.onkeydown = (e) => {
    if (e.key === "Enter") tryAdd();
  };
}

function buildSettingsSheet() {
  fillAddDropdown(document.getElementById("addDeparture"), "departureOptions", departureStops, name => {
    departureStops.push(name);
    saveStops("busapp_departures", departureStops);
    buildAll();
    buildSettingsSheet();
    render();
  });
  fillAddDropdown(document.getElementById("addDestination"), "destinationOptions", destinationStops, name => {
    destinationStops.push(name);
    saveStops("busapp_destinations", destinationStops);
    if (!selectedDestination) selectedDestination = name;
    buildAll();
    buildSettingsSheet();
    render();
  });
}

function init(data) {
  DATA = data;
  for (const info of Object.values(DATA.stops)) {
    if (!ALL_STOP_NAMES.includes(info.name)) ALL_STOP_NAMES.push(info.name);
    if (!DIRECTIONS_BY_STOP[info.name]) DIRECTIONS_BY_STOP[info.name] = [];
    if (!DIRECTIONS_BY_STOP[info.name].includes(info.direction)) {
      DIRECTIONS_BY_STOP[info.name].push(info.direction);
    }
  }
  ALL_STOP_NAMES.sort();

  departureStops = loadStops("busapp_departures");
  destinationStops = loadStops("busapp_destinations");
  selectedDeparture = departureStops[0];
  selectedDestination = destinationStops.find(n => n !== selectedDeparture) || null;

  buildAll();
  buildSettingsSheet();
  render();
  setInterval(render, 15000);

  document.getElementById("editStopsBtn").onclick = () => {
    buildSettingsSheet();
    document.getElementById("overlay").hidden = false;
  };
  document.getElementById("closeSheet").onclick = () => {
    document.getElementById("overlay").hidden = true;
  };
  document.getElementById("overlay").onclick = (e) => {
    if (e.target.id === "overlay") document.getElementById("overlay").hidden = true;
  };
}

fetch("timetable.json")
  .then(r => r.json())
  .then(init)
  .catch(err => {
    document.getElementById("subtitle").textContent = "データの読み込みに失敗しました: " + err;
  });
</script>
</body>
</html>
